<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Study</title>
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&display=swap" />
  <style>
    .bar {
      display: flex; gap: 0.6rem; align-items: center;
      flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .bar select, .bar button {
      font: inherit; font-size: 0.9rem; padding: 0.35rem 0.7rem;
      border-radius: 4px; border: 1px solid #cfd6dd; background: #fff; cursor: pointer;
    }
    .bar .spacer { margin-left: auto; font-size: 0.85rem; color: #777; }

    .stage {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.09);
      padding: 2.5rem 2rem; text-align: center; min-height: 340px;
    }

    .word {
      font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans Hebrew", "Noto Sans", system-ui, -apple-system, sans-serif;
      font-size: 3.2rem; line-height: 1.15; margin-bottom: 0.4rem;
      word-break: break-word;
    }
    .gloss { color: #8a939b; font-size: 1rem; margin-bottom: 0.5rem; }
    .word-ipa {
      font-family: "Charis SIL", "Doulos SIL", serif;
      color: #5b6b7a; font-size: 1.1rem; min-height: 1.4rem;
    }

    .letters {
      display: flex; justify-content: center; align-items: flex-start;
      gap: 0.6rem; flex-wrap: wrap; margin-top: 1.8rem;
    }

    .lt {
      min-width: 76px; padding: 0.6rem 0.4rem; border-radius: 8px;
      background: #f8f9fa;
    }
    .lt.unknown { background: #fff; border: 1px dashed #e3e8ec; }
    .lt .ch { font-size: 2rem; line-height: 1.1; font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans Hebrew", "Noto Sans", system-ui, -apple-system, sans-serif; }
    .lt .nm { font-size: 0.68rem; color: #9aa3ab; margin-top: 0.1rem; }
    .lt .ip {
      font-family: "Charis SIL", "Doulos SIL", serif;
      font-size: 0.9rem; color: #46525e; margin-top: 0.35rem; min-height: 1.1rem;
    }
    .lt .pics {
      display: flex; gap: 0.25rem; justify-content: center;
      align-items: center; margin-top: 0.45rem; min-height: 54px;
    }
    .lt .pics img { max-height: 52px; max-width: 46px; }
    .lt .pics .sw { max-height: 34px; }

    .hint {
      margin-top: 1.5rem; font-size: 0.85rem; color: #98a1a9;
    }
    kbd {
      background: #eef1f4; border: 1px solid #dde2e7; border-radius: 3px;
      padding: 0 0.35rem; font-size: 0.8rem;
    }

    .steps { display: flex; gap: 0.3rem; justify-content: center; margin-top: 1rem; }
    .steps i {
      width: 26px; height: 3px; border-radius: 2px; background: #e3e8ec;
      display: block;
    }
    .steps i.on { background: #007bff; }

    .empty { color: #98a1a9; padding: 3rem 1rem; }

    /* top-level switch between the two ways of studying */
    .modes {
      display: flex; gap: 0.4rem; margin-bottom: 1.5rem;
      border-bottom: 1px solid #e6eaee;
    }
    .modes button {
      font: inherit; font-size: 0.95rem; padding: 0.55rem 1.1rem;
      border: none; background: none; cursor: pointer; color: #7b858e;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .modes button.on { color: #1a2b3c; font-weight: bold; border-bottom-color: #007bff; }
    .modes button:hover { color: #1a2b3c; }

    .bar label { display: flex; align-items: center; gap: 0.35rem; }
    .bar button[hidden] { display: none; }

    #panel-quiz .main-content {
      display: flex;
      gap: 2rem;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    #panel-quiz .category-sidebar {
      min-width: 200px;
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 8px;
      height: fit-content;
      position: sticky;
      top: 2rem;
    }
    #panel-quiz .category-sidebar h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    #panel-quiz .category-filter {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    #panel-quiz .category-filter input[type="checkbox"] {
      margin-right: 0.5rem;
      cursor: pointer;
    }
    #panel-quiz .category-filter label {
      cursor: pointer;
      user-select: none;
    }
    #panel-quiz .practice-container {
      flex: 1;
      max-width: 600px;
    }
    #panel-quiz .language-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    #panel-quiz .language-btn { padding: 0.5rem 0.9rem; font-size: 0.9rem; }
    #panel-quiz .language-btn {
      padding: 0.75rem 1.5rem;
      background: #e0e0e0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
    }
    #panel-quiz .language-btn.active {
      background: #28a745;
      color: white;
    }
    #panel-quiz .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
    }
    #panel-quiz .tab {
      padding: 0.75rem 1.5rem;
      background: #f0f0f0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
    }
    #panel-quiz .tab.active {
      background: #007bff;
      color: white;
    }
    #panel-quiz .quiz-card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    #panel-quiz .question {
      font-size: 3rem;
      margin-bottom: 2rem;
      font-weight: bold;
    }
    #panel-quiz .hint {
      font-size: 1rem;
      color: #666;
      margin-bottom: 1rem;
    }
    #panel-quiz .answer-input {
      width: 100%;
      padding: 1rem;
      font-size: 1.5rem;
      border: 2px solid #ddd;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 1rem;
    }
    #panel-quiz .answer-input.correct {
      border-color: #28a745;
      background-color: #d4edda;
    }
    #panel-quiz .answer-input.incorrect {
      border-color: #dc3545;
      background-color: #f8d7da;
    }
    #panel-quiz .feedback {
      margin: 1rem 0;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #panel-quiz .correct-answer {
      color: #28a745;
      margin: 0.5rem 0;
    }
    #panel-quiz .difficulty-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }
    #panel-quiz .difficulty-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    #panel-quiz .btn-again { background: #dc3545; color: white; }
    #panel-quiz .btn-hard { background: #ffc107; color: black; }
    #panel-quiz .btn-good { background: #28a745; color: white; }
    #panel-quiz .btn-easy { background: #17a2b8; color: white; }
    #panel-quiz .stats {
      margin-top: 2rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 4px;
      text-align: center;
    }
    #panel-quiz .kana-keyboard {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }
    #panel-quiz .kana-keyboard.visible {
      display: block;
    }
    #panel-quiz .keyboard-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      justify-content: center;
    }
    #panel-quiz .keyboard-tab {
      padding: 0.5rem 1rem;
      background: #e0e0e0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    #panel-quiz .keyboard-tab.active {
      background: #007bff;
      color: white;
    }
    #panel-quiz .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      max-width: 400px;
      margin: 0 auto;
    }
    #panel-quiz .kana-key {
      padding: 1rem;
      background: white;
      border: 2px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    @media (max-width: 760px) {
      #panel-quiz .main-content { flex-direction: column; padding: 0; gap: 1rem; }
      #panel-quiz .category-sidebar { position: static; min-width: 0; }
      #panel-quiz .practice-container { max-width: none; }
      .modes button { padding: 0.55rem 0.7rem; font-size: 0.9rem; }
      #panel-quiz .tabs,
      #panel-quiz .language-selector { flex-wrap: wrap; gap: 0.5rem; }
      #panel-quiz .tab { padding: 0.6rem 0.9rem; font-size: 0.9rem; }
      #panel-quiz .answer-input { max-width: 100%; box-sizing: border-box; }
      #panel-quiz .kana-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    #panel-quiz .kana-key:hover {
      background: #e3f2fd;
      border-color: #007bff;
    }
    #panel-quiz .kana-key:active {
      transform: scale(0.95);
    }
    #panel-quiz .special-keys {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }
    #panel-quiz .special-key {
      padding: 0.5rem 1rem;
      background: #ff9800;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #panel-quiz .special-key:hover {
      background: #f57c00;
    }

        </div>

    <footer><p>&copy; 2026 David Ludeke</p></footer>

  <script>
    const SCRIPTS = ['greek','latin','hebrew','arabic','farsi','cyrillic',
                     'devanagari','kana','hangul','thai','geez','pinyin'];
    // 0 word · 1 letters · 2 letter IPA · 3 handshapes and SignWriting
    const LAST_STEP = 3;

    let slug = 'greek', data = null, deck = [], at = 0, step = 0;
    let deckMode = 'shuffled', deckNote = '', panel = 'cards';
    const el = id => document.getElementById(id);

    /** Accent-insensitive key, so Greek έ finds ε and Arabic أ finds ا. */
    const bare = s => s.normalize('NFD')
      .replace(/[̀-ͯٓ-ٰٕ]/g, '');

    // Hangul is written in syllable blocks, so 자 has to be taken apart into
    // its jamo before any of them can be looked up. NFD yields conjoining
    // jamo, a different set of codepoints from the standalone ones the
    // alphabet is listed in, hence the two tables.
    const CHO = [...'\u1100\u1101\u1102\u1103\u1104\u1105\u1106\u1107\u1108\u1109\u110a\u110b\u110c\u110d\u110e\u110f\u1110\u1111\u1112'];
    const CHO_C = [...'\u3131\u3132\u3134\u3137\u3138\u3139\u3141\u3142\u3143\u3145\u3146\u3147\u3148\u3149\u314a\u314b\u314c\u314d\u314e'];
    const JUNG = [...'\u1161\u1162\u1163\u1164\u1165\u1166\u1167\u1168\u1169\u116a\u116b\u116c\u116d\u116e\u116f\u1170\u1171\u1172\u1173\u1174\u1175'];
    const JUNG_C = [...'\u314f\u3150\u3151\u3152\u3153\u3154\u3155\u3156\u3157\u3158\u3159\u315a\u315b\u315c\u315d\u315e\u315f\u3160\u3161\u3162\u3163'];
    // all 27 jongseong, the eleven clusters included: without them 값
    // and 읽다 came apart into a jamo the alphabet could not name.
    const JONG = [...'\u11a8\u11a9\u11aa\u11ab\u11ac\u11ad\u11ae\u11af\u11b0\u11b1\u11b2\u11b3\u11b4\u11b5\u11b6\u11b7\u11b8\u11b9\u11ba\u11bb\u11bc\u11bd\u11be\u11bf\u11c0\u11c1\u11c2'];
    const JONG_C = [...'\u3131\u3132\u3133\u3134\u3135\u3136\u3137\u3139\u313a\u313b\u313c\u313d\u313e\u313f\u3140\u3141\u3142\u3144\u3145\u3146\u3147\u3148\u314a\u314b\u314c\u314d\u314e'];

    function jamoOf(ch) {
      // Only Hangul syllable blocks. Any accented letter decomposes under NFD
      // too, and splitting Greek έ into epsilon plus an accent would turn one
      // letter into two tiles.
      const cp = ch.codePointAt(0);
      if (cp < 0xac00 || cp > 0xd7a3) return null;
      const parts = ch.normalize('NFD');
      if (parts === ch) return null;
      const out = [];
      for (const c of parts) {
        let i = CHO.indexOf(c);
        if (i >= 0) { out.push(CHO_C[i]); continue; }
        i = JUNG.indexOf(c);
        if (i >= 0) { out.push(JUNG_C[i]); continue; }
        i = JONG.indexOf(c);
        if (i >= 0) { out.push(JONG_C[i]); continue; }
        out.push(c);
      }
      return out.length ? out : null;
    }

    // A Ge'ez syllable is a consonant in one of seven vowel orders, laid out
    // in blocks of eight. The alphabet lists first order, so round down.
    function geezBase(ch) {
      const cp = ch.codePointAt(0);
      if (cp < 0x1200 || cp > 0x137f) return null;
      // Blocks are eight wide but a consonant has only seven orders. The
      // eighth slot is a labialised syllable of its own, so rounding down
      // from it would hand back the neighbouring consonant and the tile
      // would confidently show the wrong letter.
      if ((cp - 0x1200) % 8 === 7) return null;
      return String.fromCodePoint(0x1200 + Math.floor((cp - 0x1200) / 8) * 8);
    }

    // Devanagari vowel signs are the dependent form of an independent vowel.
    const MATRA = { '\u093e': '\u0906', '\u093f': '\u0907', '\u0940': '\u0908',
                    '\u0941': '\u0909', '\u0942': '\u090a', '\u0943': '\u090b',
                    '\u0947': '\u090f', '\u0948': '\u0910', '\u094b': '\u0913',
                    '\u094c': '\u0914' };

    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function loadScript() {
      data = await (await fetch(`assets/data/scripts/${slug}.json`, { cache: 'no-cache' })).json();
      // index letters by glyph, by its pair, and by accent-stripped forms
      data.index = {};
      data.letters.forEach(L => {
        [L.glyph, L.alt, ...(L.aliases || [])].filter(Boolean).forEach(k => {
          data.index[k] = data.index[k] || L;
          data.index[bare(k)] = data.index[bare(k)] || L;
          data.index[k.toLowerCase()] = data.index[k.toLowerCase()] || L;
          data.index[bare(k).toLowerCase()] = data.index[bare(k).toLowerCase()] || L;
        });
      });
      await buildDeck();
      render();
    }

    // The practice word lists are the "extra" words: whole vocabulary rather
    // than one word per letter. Only two scripts have one.
    const extraCache = {};

    async function extraWords(s) {
      if (!extraCache[s]) {
        const r = await fetch(`assets/data/words/${s}.json`, { cache: 'no-cache' });
        if (!r.ok) return null;
        const j = await r.json();
        extraCache[s] = j.words.map(w => ({
          example_word: w.word,
          example_gloss: w.english,
          romanisation: w.romaji,
          categories: w.categories || []
        }));
      }
      return extraCache[s];
    }

    async function buildDeck() {
      deckNote = '';
      if (deckMode === 'extra') {
        const extra = await extraWords(slug);
        if (!extra) {
          deck = [];
          deckNote = `There is no practice word list for ${data.name} yet.`;
        } else {
          deck = shuffle(extra);
        }
      } else {
        const withWords = data.letters.filter(L => L.example_word);
        // "Alphabetical" means the order the script itself lists its letters,
        // which is how the reference page shows them.
        deck = deckMode === 'alpha' ? withWords : shuffle(withWords);
      }
      at = 0; step = 0;
      el('shuffleBtn').hidden = deckMode === 'alpha';
    }

    function lookup(ch) {
      const plainKana = ch.normalize('NFD').replace(/[\u3099\u309a]/g, '');
      const tries = [ch, bare(ch), ch.toLowerCase(), bare(ch).toLowerCase(),
                     MATRA[ch], geezBase(ch), plainKana];
      for (const t of tries) if (t && data.index[t]) return data.index[t];
      return null;
    }

    function render() {
      const host = el('stage');
      if (!deck.length) {
        host.innerHTML = `<p class="empty">${deckNote || 'No example words here yet.'}</p>`;
        el('progress').textContent = '';
        return;
      }
      const L = deck[at];
      const raw = L.example_word || '';
      // Pinyin entries read "\u7231 (\u00e0i)", and there the romanisation IS the
      // spellable form, so it is what gets broken into letters. Everywhere
      // else the word is already in the script and the romanisation is just
      // a reading to show alongside it.
      const pin = slug === 'pinyin' ? (raw.match(/\(([^)]+)\)/) || [])[1] : null;
      const rom = L.romanisation || pin;
      const word = raw;
      const spell = pin || raw;
      const chars = [...spell].filter(c => !/\s/.test(c))
        .flatMap(c => jamoOf(c) || [c]);

      const letters = chars.map(ch => {
        const m = lookup(ch);
        const sw = m && m.signwriting_image;
        const hand = m && (m.handshape || (m.handshape_variants && Object.values(m.handshape_variants)[0]));
        return `
          <div class="lt${m ? '' : ' unknown'}">
            <div class="ch">${m && m.display_glyph ? m.display_glyph : ch}</div>
            <div class="nm">${m ? (m.name || '') : ''}</div>
            <div class="ip">${step >= 2 && m && (m.ipa || []).length ? '/' + m.ipa.join(', ') + '/' : ''}</div>
            <div class="pics">
              ${step >= 3 && hand ? `<img src="${hand}" alt="handshape" />` : ''}
              ${step >= 3 && sw ? `<img class="sw" src="${sw}" alt="SignWriting" />` : ''}
            </div>
          </div>`;
      }).join('');

      host.innerHTML = `
        <div class="word">${word}</div>
        ${rom && step >= 1 && rom.toLowerCase() !== (L.example_gloss || '').toLowerCase()
            ? `<div class="gloss">${rom}</div>` : ''}
        <div class="gloss">${step >= 1 ? (L.example_gloss || '') : '&nbsp;'}</div>
        <div class="word-ipa">${step >= 1 && L.example_ipa ? '/' + L.example_ipa + '/' : '&nbsp;'}</div>
        ${step >= 1 ? `<div class="letters">${letters}</div>` : ''}
        <div class="steps">${[0,1,2,3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;

      el('progress').textContent =
        `${at + 1} of ${deck.length} · ${data.name}` +
        (deckMode === 'extra' ? ' · practice words' : '');
    }

    function advance() { if (step < LAST_STEP) { step++; render(); } }
    function nextWord(d = 1) {
      at = (at + d + deck.length) % deck.length;
      step = 0; render();
    }

    document.addEventListener('keydown', e => {
      if (panel !== 'cards') return;
      if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); advance(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); nextWord(-1); }
      else if (e.key === 'r' || e.key === 'R') { step = 0; render(); }
    });
    el('stage').addEventListener('click', advance);
    el('nextBtn').addEventListener('click', () => nextWord(1));
    el('shuffleBtn').addEventListener('click', () => { deck = shuffle(deck); at = 0; step = 0; render(); });

    SCRIPTS.forEach(s => {
      const o = document.createElement('option');
      o.value = s; o.textContent = s;
      el('scriptSel').appendChild(o);
    });
    el('scriptSel').value = slug;
    el('scriptSel').addEventListener('change', () => { slug = el('scriptSel').value; loadScript(); });
    el('deckSel').addEventListener('change', async () => {
      deckMode = el('deckSel').value;
      await buildDeck();
      render();
    });

    // Two panels, one page. The hash keeps the old Practice Area links working
    // and makes the quiz something you can link straight to.
    function showPanel(p) {
      panel = (p === 'quiz') ? 'quiz' : 'cards';
      el('panel-cards').hidden = panel !== 'cards';
      el('panel-quiz').hidden = panel !== 'quiz';
      el('tabCards').classList.toggle('on', panel === 'cards');
      el('tabQuiz').classList.toggle('on', panel === 'quiz');
      document.querySelector('h1').textContent =
        panel === 'quiz' ? 'Study \u2014 Quiz' : 'Study';
      if (location.hash.slice(1) !== panel) history.replaceState(null, '', '#' + panel);
    }
    document.querySelectorAll('.modes button').forEach(b =>
      b.addEventListener('click', () => showPanel(b.dataset.panel)));
    window.addEventListener('hashchange', () => showPanel(location.hash.slice(1)));

    showPanel(location.hash.slice(1) || 'cards');
    loadScript();
  </script>
  <script>
    let wordList = [];
    let allWords = [];
    let scriptMapping = {};
    let signLanguageMapping = {};
    let currentLanguage = 'kana';
    let currentMode = 'script-to-romaji';
    let currentCard = null;
    let reviewQueue = [];
    let currentKeyboardScript = 'hiragana';
    let selectedCategories = new Set();

    // Language-specific configurations
    // Every script now has a word list. The two drills that only compare the
    // word with its romanisation need nothing but that list, so they work for
    // eleven of the twelve; English is left out because transliterating Latin
    // into Latin is not a drill, and its list is used by the flashcards, where
    // the BSL and ASL handshapes are the point. The on-screen keyboard needs a glyph-to-romanisation map and
    // the sign drills need a handshape map; where those are missing the
    // keyboard stays hidden and the sign tabs stay greyed out.
    const LANGS = [
      ['kana',       'Japanese',   'JSL', ['hiragana','katakana'],   'kana-mapping.json',  null],
      ['greek',      'Greek',      'GSL', ['lowercase','uppercase'], 'greek-mapping.json', 'gsl-handshapes-mapping.json'],
      ['hebrew',     'Hebrew',     'ISL', ['letters'], null, null],
      ['arabic',     'Arabic',     'ArSL',['letters'], null, null],
      ['farsi',      'Persian',    'PSL', ['letters'], null, null],
      ['cyrillic',   'Russian',    'RSL', ['letters'], null, null],
      ['devanagari', 'Hindi',      'ISL', ['letters'], null, null],
      ['hangul',     'Korean',     'KSL', ['letters'], null, null],
      ['thai',       'Thai',       'TSL', ['letters'], null, null],
      ['geez',       'Amharic',    'EthSL',['letters'], null, null],
      ['pinyin',     'Mandarin',   'CSL', ['letters'], null, null]
    ];

    const languageConfig = {};
    const langBar = document.querySelector('#panel-quiz .language-selector');
    LANGS.forEach(([slug, name, sl, scripts, mapping, signs]) => {
      const b = document.createElement('button');
      b.className = 'language-btn' + (slug === 'kana' ? ' active' : '');
      b.dataset.language = slug;
      b.textContent = name;
      langBar.appendChild(b);
      languageConfig[slug] = {
        name, scripts,
        wordFile: `assets/data/words/${slug}.json`,
        mappingFile: mapping,
        signLanguageFile: signs,
        wordKey: 'word',
        modeLabels: [`${name} \u2192 Latin`, `Latin \u2192 ${name}`,
                     `${sl} \u2192 ${name}`, `${name} \u2192 ${sl}`],
        modes: ['script-to-romaji', 'romaji-to-script', 'sign-to-script', 'script-to-sign']
      };
    });

    // Spaced repetition intervals (in number of cards)
    const intervals = {
      again: 1,
      hard: 3,
      good: 5,
      easy: 10
    };

    async function loadData(language = currentLanguage) {
      const config = languageConfig[language];
      try {
        const fetchPromises = [
          fetch(config.wordFile),
          config.mappingFile ? fetch(config.mappingFile) : Promise.resolve(null)
        ];

        // Add sign language fetch if available
        if (config.signLanguageFile) {
          fetchPromises.push(fetch(config.signLanguageFile));
        }

        const responses = await Promise.all(fetchPromises);
        const [wordsResponse, mappingResponse, signLanguageResponse] = responses;

        if (!wordsResponse.ok) {
          throw new Error(`Failed to fetch ${config.wordFile}: ${wordsResponse.status}`);
        }
        if (config.mappingFile && !mappingResponse.ok) {
          throw new Error(`Failed to fetch ${config.mappingFile}: ${mappingResponse.status}`);
        }

        const wordsData = await wordsResponse.json();
        allWords = wordsData.words;
        scriptMapping = mappingResponse ? await mappingResponse.json() : {};

        // Load sign language mapping if available
        if (signLanguageResponse && signLanguageResponse.ok) {
          signLanguageMapping = await signLanguageResponse.json();
        } else {
          signLanguageMapping = {};
        }

        currentKeyboardScript = config.scripts[0];
        buildCategoryFilters();
        updateModeLabels();
        updateModeTabs();
        buildScriptKeyboard();
        filterWordsByCategory();
        initializeQueue();
        showNextCard();
      } catch (error) {
        console.error('Error loading data:', error);
        const errorMsg = `Failed to load ${language} data files.\n\nError: ${error.message}\n\nNote: If you're opening this file directly (file:// protocol), you need to run a local web server. Try:\n  python3 -m http.server 8000\nThen open: http://localhost:8000/practice.html`;
        alert(errorMsg);
      }
    }

    function updateModeLabels() {
      const config = languageConfig[currentLanguage];
      for (let i = 0; i < 4; i++) {
        const label = document.getElementById(`modeLabel${i + 1}`);
        if (label) {
          label.textContent = config.modeLabels[i] || '';
        }
      }
    }

    function updateModeTabs() {
      const config = languageConfig[currentLanguage];
      const tabs = document.querySelectorAll('.tab');

      tabs.forEach((tab, index) => {
        if (index < config.modes.length) {
          tab.style.display = 'inline-block';
          // Disable sign language modes if mapping not available
          if ((config.modes[index] === 'sign-to-script' || config.modes[index] === 'script-to-sign') && !config.signLanguageFile) {
            tab.style.opacity = '0.5';
            tab.style.cursor = 'not-allowed';
            tab.disabled = true;
          } else {
            tab.style.opacity = '1';
            tab.style.cursor = 'pointer';
            tab.disabled = false;
          }
        } else {
          tab.style.display = 'none';
        }
      });
    }

    function buildCategoryFilters() {
      // Extract all unique categories from words
      const categoriesSet = new Set();
      allWords.forEach(word => {
        if (word.categories) {
          word.categories.forEach(cat => categoriesSet.add(cat));
        }
      });

      const categories = Array.from(categoriesSet).sort();

      // Select all categories by default
      selectedCategories = new Set(categories);

      const filtersContainer = document.getElementById('categoryFilters');
      if (!filtersContainer) {
        console.error('categoryFilters element not found!');
        return;
      }

      filtersContainer.innerHTML = '';

      categories.forEach(category => {
        const filterDiv = document.createElement('div');
        filterDiv.className = 'category-filter';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `category-${category}`;
        checkbox.value = category;
        checkbox.checked = true;
        checkbox.addEventListener('change', handleCategoryChange);

        const label = document.createElement('label');
        label.htmlFor = `category-${category}`;
        label.textContent = category;

        filterDiv.appendChild(checkbox);
        filterDiv.appendChild(label);
        filtersContainer.appendChild(filterDiv);
      });
    }

    function handleCategoryChange(event) {
      const category = event.target.value;
      if (event.target.checked) {
        selectedCategories.add(category);
      } else {
        selectedCategories.delete(category);
      }
      filterWordsByCategory();
      initializeQueue();
      showNextCard();
    }

    function filterWordsByCategory() {
      if (selectedCategories.size === 0) {
        wordList = [];
        return;
      }

      wordList = allWords.filter(word => {
        if (!word.categories || word.categories.length === 0) {
          return false;
        }
        return word.categories.some(cat => selectedCategories.has(cat));
      });

      // Randomize the word list
      wordList = shuffleArray([...wordList]);
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function initializeQueue() {
      reviewQueue = wordList.map((word, index) => ({
        ...word,
        id: index,
        nextReview: 0
      }));
      updateQueueCount();
    }

    function updateQueueCount() {
      document.getElementById('queueCount').textContent = reviewQueue.length;
    }

    function showNextCard() {
      if (reviewQueue.length === 0) {
        initializeQueue();
      }

      if (reviewQueue.length === 0) {
        // No words available for selected categories
        const questionEl = document.getElementById('question');
        questionEl.textContent = 'No words available. Please select at least one category.';
        return;
      }

      // Sort by nextReview and get the first card
      reviewQueue.sort((a, b) => a.nextReview - b.nextReview);
      currentCard = reviewQueue[0];

      const questionEl = document.getElementById('question');
      const hintEl = document.getElementById('hint');
      const answerEl = document.getElementById('answer');
      const feedbackEl = document.getElementById('feedback');
      const correctAnswerEl = document.getElementById('correctAnswer');
      const questionImageDiv = document.getElementById('questionImage');
      const questionImg = document.getElementById('questionImg');
      const revealButton = document.getElementById('revealButton');
      const answerImageContainer = document.getElementById('answerImageContainer');
      const answerImages = document.getElementById('answerImages');

      // Reset display
      answerEl.value = '';
      answerEl.className = 'answer-input';
      feedbackEl.textContent = '';
      correctAnswerEl.textContent = '';
      hintEl.textContent = '';
      questionImageDiv.style.display = 'none';
      questionImg.src = '';
      answerImageContainer.style.display = 'none';
      answerImages.innerHTML = '';
      revealButton.style.display = 'none';
      document.getElementById('difficultyButtons').style.display = 'none';
      document.getElementById('kanaKeyboard').classList.remove('visible');

      const config = languageConfig[currentLanguage];
      const scriptKey = config.wordKey;

      switch (currentMode) {
        case 'script-to-romaji':
          // Show script, answer with Latin letters
          questionEl.textContent = currentCard[scriptKey];
          questionEl.style.display = 'block';
          answerEl.style.display = 'block';
          answerEl.focus();
          break;

        case 'romaji-to-script':
          // Show Latin letters, answer with script
          questionEl.textContent = currentCard.romaji;
          questionEl.style.display = 'block';
          answerEl.style.display = 'block';
          document.getElementById('kanaKeyboard').classList.add('visible');
          answerEl.focus();
          break;

        case 'sign-to-script':
          // Show handshapes for each letter in word, answer with script
          if (signLanguageMapping.handshapes) {
            questionEl.style.display = 'none';
            const greekWord = currentCard[scriptKey];
            const handshapeImgs = getHandshapesForWord(greekWord);

            if (handshapeImgs.length > 0) {
              // Create a container for multiple handshapes
              answerImages.innerHTML = '';
              handshapeImgs.forEach(imgSrc => {
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = 'Handshape';
                img.style.maxWidth = '150px';
                img.style.height = 'auto';
                answerImages.appendChild(img);
              });
              answerImageContainer.style.display = 'block';
              answerEl.style.display = 'block';
              // Show keyboard for Greek language
              if (currentLanguage === 'greek') {
                document.getElementById('kanaKeyboard').classList.add('visible');
              }
              answerEl.focus();
            }
          }
          break;

        case 'script-to-sign':
          // Show script, reveal handshapes
          questionEl.textContent = currentCard[scriptKey];
          questionEl.style.display = 'block';
          answerEl.style.display = 'none';
          revealButton.style.display = 'inline-block';
          break;
      }

      updateQueueCount();
    }

    function findHandshapeForLetter(romaji) {
      if (!signLanguageMapping.handshapes) return null;
      const letterName = romaji.toLowerCase();
      return signLanguageMapping.handshapes[letterName] || null;
    }

    function getHandshapesForWord(greekWord) {
      // Convert Greek word to array of letter names and get handshape images
      const handshapeImages = [];

      for (let char of greekWord) {
        // Map Greek letter to its romanized name
        const letterName = greekLetterToRomanName(char);
        if (letterName) {
          const handshape = signLanguageMapping.handshapes[letterName];
          if (handshape && handshape.image) {
            handshapeImages.push(handshape.image);
          }
        }
      }

      return handshapeImages;
    }

    function greekLetterToRomanName(greekChar) {
      // Map Greek letters (uppercase) to their romanized names
      const greekToRoman = {
        'Α': 'alpha', 'Β': 'beta', 'Γ': 'gamma', 'Δ': 'delta',
        'Ε': 'epsilon', 'Ζ': 'zeta', 'Η': 'eta', 'Θ': 'theta',
        'Ι': 'iota', 'Κ': 'kappa', 'Λ': 'lambda', 'Μ': 'mu',
        'Ν': 'nu', 'Ξ': 'xi', 'Ο': 'omicron', 'Π': 'pi',
        'Ρ': 'rho', 'Σ': 'sigma', 'Τ': 'tau', 'Υ': 'upsilon',
        'Φ': 'phi', 'Χ': 'chi', 'Ψ': 'psi', 'Ω': 'omega',
        // Lowercase versions
        'α': 'alpha', 'β': 'beta', 'γ': 'gamma', 'δ': 'delta',
        'ε': 'epsilon', 'ζ': 'zeta', 'η': 'eta', 'θ': 'theta',
        'ι': 'iota', 'κ': 'kappa', 'λ': 'lambda', 'μ': 'mu',
        'ν': 'nu', 'ξ': 'xi', 'ο': 'omicron', 'π': 'pi',
        'ρ': 'rho', 'σ': 'sigma', 'ς': 'sigma', 'τ': 'tau',
        'υ': 'upsilon', 'φ': 'phi', 'χ': 'chi', 'ψ': 'psi', 'ω': 'omega'
      };

      return greekToRoman[greekChar] || null;
    }

    function buildScriptKeyboard() {
      const hasKeyboard = !!languageConfig[currentLanguage].mappingFile;
      document.getElementById('kanaKeyboard').style.display = hasKeyboard ? '' : 'none';
      const kanaGrid = document.getElementById('kanaGrid');
      // clear first, so switching to a script without a keyboard does not
      // leave the previous script's keys sitting in the hidden grid
      kanaGrid.innerHTML = '';
      if (!hasKeyboard) return;

      const scriptChars = scriptMapping[currentKeyboardScript];

      if (scriptChars) {
        for (const [char, romaji] of Object.entries(scriptChars)) {
          const button = document.createElement('button');
          button.className = 'kana-key';
          button.textContent = char;
          button.dataset.char = char;
          button.addEventListener('click', (e) => {
            e.preventDefault();
            const answerInput = document.getElementById('answer');
            answerInput.value += char;
            // Don't call focus() to prevent page from jumping
          });
          kanaGrid.appendChild(button);
        }
      }

      // Update keyboard tabs
      const config = languageConfig[currentLanguage];
      const keyboardTabs = document.querySelectorAll('.keyboard-tab');
      keyboardTabs.forEach((tab, index) => {
        if (index < config.scripts.length) {
          tab.style.display = 'block';
          tab.textContent = config.scripts[index].charAt(0).toUpperCase() + config.scripts[index].slice(1);
          tab.dataset.script = config.scripts[index];
        } else {
          tab.style.display = 'none';
        }
      });
    }

    function checkAnswer() {
      const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
      const answerEl = document.getElementById('answer');
      const feedbackEl = document.getElementById('feedback');
      const correctAnswerEl = document.getElementById('correctAnswer');
      const hintEl = document.getElementById('hint');

      const config = languageConfig[currentLanguage];
      const scriptKey = config.wordKey;

      let correctAnswer;
      let correctAnswerDisplay;
      if (currentMode === 'script-to-romaji') {
        correctAnswerDisplay = currentCard.romaji;
        correctAnswer = currentCard.romaji.toLowerCase();
      } else {
        correctAnswerDisplay = currentCard[scriptKey];
        correctAnswer = currentCard[scriptKey].toLowerCase();
      }

      const isCorrect = userAnswer === correctAnswer;

      // Show the English meaning after submission
      hintEl.textContent = `(${currentCard.english})`;

      if (isCorrect) {
        answerEl.className = 'answer-input correct';
        feedbackEl.textContent = '✓ Correct!';
        feedbackEl.style.color = '#28a745';
      } else {
        answerEl.className = 'answer-input incorrect';
        feedbackEl.textContent = '✗ Incorrect';
        feedbackEl.style.color = '#dc3545';
        correctAnswerEl.textContent = `Correct answer: ${correctAnswerDisplay}`;
      }

      document.getElementById('difficultyButtons').style.display = 'flex';
    }

    function handleDifficulty(difficulty) {
      const interval = intervals[difficulty];

      // Remove current card from queue
      reviewQueue.shift();

      // Calculate when this card should appear again
      currentCard.nextReview = interval;

      // Decrement all nextReview counters
      reviewQueue.forEach(card => {
        if (card.nextReview > 0) card.nextReview--;
      });

      // Add card back to queue
      reviewQueue.push(currentCard);

      showNextCard();
    }

    // Event listeners
    // Language selector
    document.querySelectorAll('.language-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const button = e.currentTarget;
        const newLanguage = button.dataset.language;

        // Only reload if language actually changed
        if (newLanguage !== currentLanguage) {
          document.querySelectorAll('.language-btn').forEach(b => b.classList.remove('active'));
          button.classList.add('active');
          currentLanguage = newLanguage;
          loadData(currentLanguage);
        }
      });
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        const button = e.currentTarget;
        if (button.disabled) return;

        const modeIndex = parseInt(button.dataset.modeIndex);
        const config = languageConfig[currentLanguage];
        const newMode = config.modes[modeIndex];

        // Only update if mode actually changed
        if (newMode !== currentMode) {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          button.classList.add('active');
          currentMode = newMode;
          showNextCard();
        }
      });
    });

    document.getElementById('answer').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const diffButtons = document.getElementById('difficultyButtons');
        if (diffButtons.style.display === 'none') {
          checkAnswer();
        } else {
          handleDifficulty('good');
        }
      }
    });

    document.querySelectorAll('.difficulty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        handleDifficulty(e.target.dataset.difficulty);
      });
    });

    // Keyboard tab switching
    document.querySelectorAll('.keyboard-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.keyboard-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentKeyboardScript = e.target.dataset.script;
        buildScriptKeyboard();
      });
    });

    // Special keyboard keys
    document.getElementById('backspaceKey').addEventListener('click', (e) => {
      e.preventDefault();
      const answerInput = document.getElementById('answer');
      answerInput.value = answerInput.value.slice(0, -1);
      // Don't call focus() to prevent page from jumping
    });

    document.getElementById('clearKey').addEventListener('click', (e) => {
      e.preventDefault();
      const answerInput = document.getElementById('answer');
      answerInput.value = '';
      // Don't call focus() to prevent page from jumping
    });

    // Reveal button for sign language mode
    function revealHandshapes() {
      if (currentMode === 'script-to-sign') {
        const config = languageConfig[currentLanguage];
        const scriptKey = config.wordKey;
        const greekWord = currentCard[scriptKey];
        const handshapeImgs = getHandshapesForWord(greekWord);

        if (handshapeImgs.length > 0) {
          const answerImages = document.getElementById('answerImages');
          const answerImageContainer = document.getElementById('answerImageContainer');

          answerImages.innerHTML = '';
          handshapeImgs.forEach(imgSrc => {
            const img = document.createElement('img');
            img.src = imgSrc;
            img.alt = 'Handshape';
            img.style.maxWidth = '150px';
            img.style.height = 'auto';
            answerImages.appendChild(img);
          });

          answerImageContainer.style.display = 'block';
          document.getElementById('revealButton').style.display = 'none';
          document.getElementById('difficultyButtons').style.display = 'flex';
        }
      }
    }

    document.getElementById('revealButton').addEventListener('click', revealHandshapes);

    // Global keyboard handler for Enter and Space in script-to-sign mode
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('panel-quiz').hidden) return;
      if (currentMode === 'script-to-sign') {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); // Prevent space from scrolling the page

          const revealButton = document.getElementById('revealButton');
          const diffButtons = document.getElementById('difficultyButtons');

          // If reveal button is visible, click it
          if (revealButton.style.display !== 'none' && revealButton.style.display !== '') {
            revealHandshapes();
          }
          // If difficulty buttons are visible, click "Good"
          else if (diffButtons.style.display === 'flex') {
            handleDifficulty('good');
          }
        }
      }
    });

    // Initialize
    loadData();
  </script>
