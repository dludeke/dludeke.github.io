<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Study</title>
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Hebrew:wght@400;700&display=swap" />
    <!-- ipa-font: Charis SIL cut to the characters the IPA here uses, so a mark and its base come from one face. Generated by generate_ipa_font.py. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&display=swap&text=%20%28%29%2C-.%2F%3A%3B%5B%5Dabcdefghijklmnopqrstuvwxyz%7B%7D%C3%A0%C3%A1%C3%A2%C3%A3%C3%A4%C3%A6%C3%A7%C3%A8%C3%AA%C3%AC%C3%AD%C3%B0%C3%B3%C3%B4%C3%B8%C3%B9%C3%BA%C3%BB%C4%81%C4%A7%C5%8B%C7%8E%C7%90%C7%92%C7%94%C9%90%C9%91%C9%92%C9%94%C9%95%C9%96%C9%99%C9%9A%C9%9B%C9%9C%C9%A1%C9%A2%C9%A3%C9%A4%C9%A5%C9%A6%C9%A8%C9%AA%C9%AB%C9%AF%C9%B0%C9%B2%C9%B3%C9%B4%C9%B5%C9%B8%C9%B9%C9%BB%C9%BD%C9%BE%CA%81%CA%82%CA%83%CA%88%CA%8A%CA%8B%CA%8C%CA%8E%CA%90%CA%91%CA%92%CA%94%CA%95%CA%9D%CA%B0%CA%B1%CA%B2%CA%B7%CA%BC%CB%80%CB%88%CB%8C%CB%90%CB%91%CB%A4%CB%A5%CB%A6%CB%A7%CB%A8%CB%A9%CC%80%CC%81%CC%82%CC%83%CC%8C%CC%9A%CC%A9%CC%AA%CC%AF%CD%88%CD%A1%CE%B8%CF%87%E2%80%93%E2%80%94%E2%81%BF" />
  <style>
    .bar {
      display: flex; gap: 0.6rem; align-items: center;
      flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .bar select, .bar button {
      font: inherit; font-size: 0.9rem; padding: 0.35rem 0.7rem;
      border-radius: 4px; border: 1px solid #cfd6dd; background: #fff; cursor: pointer;
    }
    .bar .spacer { margin-left: auto; font-size: 0.85rem; color: #777; }

    .stage {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.09);
      padding: 2.5rem 2rem; text-align: center; min-height: 340px;
    }

    .word {
      font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans Hebrew", "Noto Sans", system-ui, -apple-system, sans-serif;
      font-size: 3.2rem; line-height: 1.15; margin-bottom: 0.4rem;
      word-break: break-word;
    }
    .gloss { color: #8a939b; font-size: 1rem; margin-bottom: 0.5rem; }
    .word-ipa {
      font-family: "Charis SIL", "Doulos SIL", "Gentium Plus",
                   "Lucida Sans Unicode", "Arial Unicode MS", serif;
      color: #5b6b7a; font-size: 1.1rem; min-height: 1.4rem;
    }

    .letters {
      display: flex; justify-content: center; align-items: flex-start;
      gap: 0.6rem; flex-wrap: wrap; margin-top: 1.8rem;
    }

    .lt {
      min-width: 76px; padding: 0.6rem 0.4rem; border-radius: 8px;
      background: #f8f9fa;
    }
    .lt.unknown { background: #fff; border: 1px dashed #e3e8ec; }
    .lt .ch { font-size: 2rem; line-height: 1.1; font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans Hebrew", "Noto Sans", system-ui, -apple-system, sans-serif; }
    .lt .nm { font-size: 0.68rem; color: #9aa3ab; margin-top: 0.1rem; }
    .lt .nm-ipa {
      font-family: "Charis SIL", "Doulos SIL", "Gentium Plus",
                   "Lucida Sans Unicode", "Arial Unicode MS", serif;
      font-size: 0.64rem; color: #b4bcc4; min-height: 0.9rem;
    }
    .lt .ip {
      font-family: "Charis SIL", "Doulos SIL", "Gentium Plus",
                   "Lucida Sans Unicode", "Arial Unicode MS", serif;
      font-size: 0.9rem; color: #46525e; margin-top: 0.35rem; min-height: 1.1rem;
    }
    .lt .pics {
      display: flex; gap: 0.25rem; justify-content: center;
      align-items: center; margin-top: 0.45rem; min-height: 54px;
    }
    .lt .pics img { max-height: 52px; max-width: 46px; }
    .lt .pics .sw { max-height: 34px; }
    .lt .pics .mv { max-height: 18px; max-width: 28px; opacity: 0.75; }

    .hint {
      margin-top: 1.5rem; font-size: 0.85rem; color: #98a1a9;
    }
    kbd {
      background: #eef1f4; border: 1px solid #dde2e7; border-radius: 3px;
      padding: 0 0.35rem; font-size: 0.8rem;
    }

    .steps { display: flex; gap: 0.3rem; justify-content: center; margin-top: 1rem; }
    .steps i {
      width: 26px; height: 3px; border-radius: 2px; background: #e3e8ec;
      display: block;
    }
    .steps i.on { background: #007bff; }

    .empty { color: #98a1a9; padding: 3rem 1rem; }

    .pg-modes { display: inline-flex; gap: 0.3rem; }
    .pg-modes button.on { background: #007bff; color: #fff; border-color: #007bff; }
    .pg-modes button[disabled] { opacity: 0.45; cursor: not-allowed; }
    .pg-hint { font-size: 0.85rem; color: #555; }
    .pg-hint input { margin-right: 0.3rem; }

    .pg-stage {
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.09);
      padding: 2rem; min-height: 320px;
    }
    .pg-text {
      font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic",
                   "Noto Sans Hebrew", "Noto Sans", system-ui, sans-serif;
      font-size: 1.9rem; line-height: 1.75; white-space: pre-wrap;
      word-break: break-word; margin-bottom: 0.8rem;
    }
    /* each character is its own span so typing can be marked against it */
    .pg-text i { font-style: normal; }
    .pg-text i.ok { color: #28a745; }
    .pg-text i.bad { color: #dc3545; background: #fdeaec; border-radius: 2px; }
    .pg-text i.at { border-bottom: 2px solid #007bff; }
    .pg-text i.seen { color: #9aa3ab; }

    .pg-gloss { color: #8a939b; font-size: 0.95rem; margin-bottom: 0.5rem; }
    .pg-ipa {
      font-family: "Charis SIL", "Doulos SIL", "Gentium Plus",
                   "Lucida Sans Unicode", "Arial Unicode MS", serif;
      color: #5b6b7a; font-size: 1rem; white-space: pre-wrap; margin-bottom: 0.8rem;
    }
    .pg-note { color: #98a1a9; font-size: 0.85rem; margin-top: 1.2rem; }
    .pg-cover { font-size: 0.8rem; color: #9aa3ab; margin-bottom: 1rem; }
    .pg-cover b { color: #46525e; font-weight: bold; }

    .pg-input {
      width: 100%; box-sizing: border-box; font-size: 1.3rem; padding: 0.8rem;
      border: 2px solid #dde2e7; border-radius: 6px; font-family: inherit;
      min-height: 5rem; resize: vertical;
    }
    .pg-input:focus { outline: none; border-color: #007bff; }
    .pg-done { color: #28a745; font-weight: bold; margin-top: 0.6rem; }

    /* fingerspelling: one big handshape at a time */
    .pg-sign { text-align: center; }
    .pg-sign .big { font-size: 3.4rem; line-height: 1.1; }
    .pg-sign .nm { color: #9aa3ab; font-size: 0.8rem; margin-top: 0.2rem; }
    .pg-sign .ip {
      font-family: "Charis SIL", "Doulos SIL", "Gentium Plus",
                   "Lucida Sans Unicode", "Arial Unicode MS", serif;
      color: #5b6b7a; min-height: 1.3rem;
    }
    .pg-sign .shot { min-height: 150px; display: flex; justify-content: center;
                     align-items: center; gap: 0.6rem; margin: 0.8rem 0; }
    .pg-sign .shot img { max-height: 148px; }
    .pg-sign .shot img.mv { max-height: 42px; opacity: 0.75; }
    .pg-strip {
      display: flex; flex-wrap: wrap; gap: 0.15rem; justify-content: center;
      margin-top: 1.2rem; font-size: 1.1rem;
    }
    .pg-strip i { font-style: normal; color: #c3cad1; padding: 0 0.1rem; }
    .pg-strip i.seen { color: #46525e; }
    .pg-strip i.at { color: #007bff; border-bottom: 2px solid #007bff; }

    /* top-level switch between the two ways of studying */
    .modes {
      display: flex; gap: 0.4rem; margin-bottom: 1.5rem;
      border-bottom: 1px solid #e6eaee;
    }
    .modes button {
      font: inherit; font-size: 0.95rem; padding: 0.55rem 1.1rem;
      border: none; background: none; cursor: pointer; color: #7b858e;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .modes button.on { color: #1a2b3c; font-weight: bold; border-bottom-color: #007bff; }
    .modes button:hover { color: #1a2b3c; }

    .bar label { display: flex; align-items: center; gap: 0.35rem; }
    .bar button[hidden] { display: none; }

    .main-content {
      display: flex;
      gap: 2rem;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }
    .category-sidebar {
      min-width: 200px;
      background: #f8f9fa;
      padding: 1.5rem;
      border-radius: 8px;
      height: fit-content;
      position: sticky;
      top: 2rem;
    }
    .category-sidebar h3 {
      margin-top: 0;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }
    .category-filter {
      display: flex;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .category-filter input {
      margin-right: 0.5rem;
      cursor: pointer;
    }
    .category-sidebar h3 + h3 { margin-top: 1.5rem; }
    /* a sidebar control that is a button rather than a box to tick */
    .side-btn {
      display: block; width: 100%; text-align: left; font: inherit;
      font-size: 0.95rem; padding: 0.5rem 0.7rem; margin-bottom: 0.4rem;
      border: 1px solid #dfe4e9; border-radius: 5px; background: #fff;
      cursor: pointer; color: #33404c;
    }
    .side-btn:hover:not([disabled]) { background: #eef2f5; }
    .side-btn.on { background: #007bff; border-color: #007bff; color: #fff; }
    .side-btn[disabled] { color: #aeb6bd; cursor: not-allowed; background: #f4f6f8; }
    .category-filter label {
      cursor: pointer;
      user-select: none;
    }
    .practice-container {
      flex: 1;
      max-width: 600px;
    }
    .language-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }
    .language-btn { padding: 0.5rem 0.9rem; font-size: 0.9rem; }
    .language-btn {
      padding: 0.75rem 1.5rem;
      background: #e0e0e0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
    }
    .language-btn.active {
      background: #28a745;
      color: white;
    }
    #panel-quiz .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
    }
    #panel-quiz .tab {
      padding: 0.75rem 1.5rem;
      background: #f0f0f0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
    }
    #panel-quiz .tab.active {
      background: #007bff;
      color: white;
    }
    #panel-quiz .quiz-card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }
    #panel-quiz .question {
      font-size: 3rem;
      margin-bottom: 2rem;
      font-weight: bold;
      /* a harakat only sits on its letter when both come from the same
         font run; with the system fallback the mark lands on nothing */
      font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic",
                   "Noto Sans Hebrew", "Noto Sans", system-ui, sans-serif;
    }
    #panel-quiz .word-ipa {
      color: #4a5560;
      font-size: 1.15rem;
      margin: -1.25rem 0 0.75rem;
      min-height: 1em;
    }

    .answer-shapes { display: none; margin: 1.25rem 0 0.25rem; }
    .answer-shapes.on { display: block; }
    .answer-shapes .k {
      color: #96a0a8; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.09em; display: block; margin-bottom: 0.5rem;
    }
    .answer-shapes .strip {
      display: flex; flex-wrap: wrap; gap: 0.55rem; justify-content: center;
    }
    .answer-shapes .sh {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.2rem; min-width: 46px;
    }
    .answer-shapes .sh img { max-height: 62px; max-width: 80px; border-radius: 4px; }
    .answer-shapes .sh img.sw { max-height: 46px; }
    /* as the question rather than the answer key, where it is the thing
       being read, so it wants the room */
    .answer-shapes.asking { margin: 0 0 1.5rem; }
    .answer-shapes.asking .strip { gap: 0.7rem; }
    .answer-shapes.asking .sh img { max-height: 108px; max-width: 108px; }
    .answer-shapes.asking .sh img.sw { max-height: 96px; }
    .answer-shapes.asking .sh .mv { max-height: 26px; max-width: 60px; }
    .answer-shapes .sh .mv { max-height: 15px; max-width: 42px; opacity: 0.75; }
    .answer-shapes .sh .ch {
      font-size: 1.1rem;
      font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic",
                   "Noto Sans Hebrew", "Noto Sans", system-ui, sans-serif;
    }
    .answer-shapes .sh .none {
      color: #c3c9cf; font-size: 0.68rem; border: 1px dashed #d8dde2;
      border-radius: 4px; padding: 0.9rem 0.4rem;
    }
    .answer-shapes .miss { color: #96a0a8; font-size: 0.78rem; margin-top: 0.5rem; }

    .vowel-hint {
      background: #fff;
      border: 1px solid #ccd3d9;
      border-radius: 999px;
      color: #4a5560;
      cursor: pointer;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      padding: 0.35rem 0.9rem;
    }
    .vowel-hint:hover { background: #f2f5f7; }
    .vowel-hint[disabled] { color: #9aa3ab; cursor: default; }
    #panel-quiz .hint {
      font-size: 1rem;
      color: #666;
      margin-bottom: 1rem;
    }
    #panel-quiz .answer-input {
      width: 100%;
      padding: 1rem;
      font-size: 1.5rem;
      border: 2px solid #ddd;
      border-radius: 4px;
      text-align: center;
      margin-bottom: 1rem;
    }
    #panel-quiz .answer-input.correct {
      border-color: #28a745;
      background-color: #d4edda;
    }
    #panel-quiz .answer-input.incorrect {
      border-color: #dc3545;
      background-color: #f8d7da;
    }
    #panel-quiz .feedback {
      margin: 1rem 0;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #panel-quiz .correct-answer {
      color: #28a745;
      margin: 0.5rem 0;
    }
    #panel-quiz .difficulty-buttons {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }
    #panel-quiz .difficulty-btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    #panel-quiz .btn-again { background: #dc3545; color: white; }
    #panel-quiz .btn-hard { background: #ffc107; color: black; }
    #panel-quiz .btn-good { background: #28a745; color: white; }
    #panel-quiz .btn-easy { background: #17a2b8; color: white; }
    #panel-quiz .stats {
      margin-top: 2rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 4px;
      text-align: center;
    }
    #panel-quiz .kana-keyboard {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f8f9fa;
      border-radius: 8px;
      display: none;
    }
    #panel-quiz .kana-keyboard.visible {
      display: block;
    }
    #panel-quiz .keyboard-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      justify-content: center;
    }
    #panel-quiz .keyboard-tab {
      padding: 0.5rem 1rem;
      background: #e0e0e0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9rem;
    }
    #panel-quiz .keyboard-tab.active {
      background: #007bff;
      color: white;
    }
    #panel-quiz .kana-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      max-width: 400px;
      margin: 0 auto;
    }
    #panel-quiz .kana-key {
      padding: 1rem;
      background: white;
      border: 2px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.2s;
    }
    @media (max-width: 760px) {
      .main-content { flex-direction: column; padding: 0; gap: 1rem; }
      .category-sidebar { position: static; min-width: 0; }
      .practice-container { max-width: none; }
      .modes button { padding: 0.55rem 0.7rem; font-size: 0.9rem; }
      #panel-quiz .tabs,
      .language-selector { flex-wrap: wrap; gap: 0.5rem; }
      #panel-quiz .tab { padding: 0.6rem 0.9rem; font-size: 0.9rem; }
      #panel-quiz .answer-input { max-width: 100%; box-sizing: border-box; }
      #panel-quiz .kana-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    }

    #panel-quiz .kana-key:hover {
      background: #e3f2fd;
      border-color: #007bff;
    }
    #panel-quiz .kana-key:active {
      transform: scale(0.95);
    }
    #panel-quiz .special-keys {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1rem;
    }
    #panel-quiz .special-key {
      padding: 0.5rem 1rem;
      background: #ff9800;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #panel-quiz .special-key:hover {
      background: #f57c00;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Study</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="art.html">Art Portfolio</a></li>
          <li><a href="publications.html">Publications</a></li>
          <li class="has-sub">
            <a href="lugha.html">Lugha</a>
            <ul class="subnav">
              <li><a href="reference.html">Reference</a></li>
              <li><a href="study.html" aria-current="page">Study</a></li>
              <li><a href="signs.html">Country Signs</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="modes">
        <button id="tabCards" class="on" data-panel="cards">Flashcards</button>
        <button id="tabQuiz" data-panel="quiz">Quiz</button>
        <button id="tabPangram" data-panel="pangram">Pangrams</button>
      </div>

      <section id="panel-cards">
        <div class="main-content">
          <div class="category-sidebar">
            <h3>Deck</h3>
            <div id="deckChoices"><!-- one radio per deck --></div>
          </div>

          <div class="practice-container">
            <div class="language-selector" id="cardScripts">
              <!-- one button per script, in reference order -->
            </div>

            <div class="bar">
              <button id="nextBtn">Next word</button>
              <button id="shuffleBtn">Reshuffle</button>
              <span class="spacer" id="progress"></span>
            </div>

            <div class="stage" id="stage"><p class="empty">Loading&hellip;</p></div>

            <p class="hint">
              <kbd>space</kbd> reveal the next layer &middot;
              <kbd>&rarr;</kbd> next word &middot;
              <kbd>&larr;</kbd> previous &middot;
              <kbd>r</kbd> start this word again
            </p>
          </div>
        </div>
      </section>

      <section id="panel-pangram" hidden>
        <div class="main-content">
          <div class="category-sidebar">
            <h3>Mode</h3>
            <button id="pgTypeBtn" class="side-btn on" type="button">Type it</button>
            <button id="pgSignBtn" class="side-btn" type="button">Fingerspell it</button>
            <h3>Hints</h3>
            <div class="category-filter">
              <input type="checkbox" id="pgIpa" />
              <label for="pgIpa">IPA</label>
            </div>
          </div>

          <div class="practice-container">
            <div class="language-selector" id="pgScripts">
              <!-- one button per script, in reference order -->
            </div>
            <div class="bar"><span class="spacer" id="pgProgress"></span></div>
            <div class="pg-stage" id="pgStage"><p class="empty">Loading&hellip;</p></div>
          </div>
        </div>
      </section>

      <section id="panel-quiz" hidden>
        <div class="main-content">
        <div class="category-sidebar">
          <h3>Categories</h3>
          <div id="categoryFilters"></div>
        </div>

        <div class="practice-container">
          <div class="language-selector">
            <!-- filled from LANGS, one button per script -->
          </div>

        <div class="tabs">
          <button class="tab active" data-mode-index="0"><span id="modeLabel1">From Kana</span></button>
          <button class="tab" data-mode-index="1"><span id="modeLabel2">From Latin Letters</span></button>
          <button class="tab" data-mode-index="2"><span id="modeLabel3">JSL → Kana</span></button>
          <button class="tab" data-mode-index="3"><span id="modeLabel4">Kana → JSL</span></button>
        </div>

        <div class="quiz-card">
          <div class="question" id="question"></div>
          <div id="answerImageContainer" style="display: none; text-align: center; margin: 1rem 0;">
            <div id="answerImages" style="display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem;"></div>
          </div>
          <!-- Arabic prints no short vowels, so reading a word aloud means
               knowing it already. This puts them in on request. -->
          <button type="button" id="vowelHint" class="vowel-hint" style="display: none;">
            Show vowel marks</button>
          <!-- How the word is said, shown with the answer. It sits between
               the word and its meaning because that is the order you read
               a dictionary entry in. -->
          <div class="word-ipa" id="wordIpa"></div>
          <div class="hint" id="hint"></div>
          <input type="text" class="answer-input" id="answer" placeholder="Type your answer..." autocomplete="off" />
          <div style="text-align: center;">
            <button id="revealButton" style="display: none; padding: 1rem 2rem; font-size: 1.2rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 1rem 0;">Reveal Answer</button>
          </div>
          <div class="feedback" id="feedback"></div>
          <div class="correct-answer" id="correctAnswer"></div>
          <!-- The word fingerspelled, shown once an answer is in, so that
               typing it and signing it can be checked in the same pass. -->
          <div class="answer-shapes" id="answerShapes"></div>
          <div class="difficulty-buttons" id="difficultyButtons" style="display: none;">
            <button class="difficulty-btn btn-again" data-difficulty="again">Again</button>
            <button class="difficulty-btn btn-hard" data-difficulty="hard">Hard</button>
            <button class="difficulty-btn btn-good" data-difficulty="good">Good</button>
            <button class="difficulty-btn btn-easy" data-difficulty="easy">Easy</button>
          </div>
        </div>

        <div id="kanaKeyboard" class="kana-keyboard">
          <div class="keyboard-tabs">
            <button class="keyboard-tab active" data-script="hiragana">Hiragana</button>
            <button class="keyboard-tab" data-script="katakana">Katakana</button>
          </div>
          <div id="kanaGrid" class="kana-grid"></div>
          <div class="special-keys">
            <button class="special-key" id="backspaceKey">Backspace</button>
            <button class="special-key" id="clearKey">Clear</button>
          </div>
        </div>

        <div class="stats">
          <p>Cards in queue: <span id="queueCount">0</span></p>
        </div>
        </div>
        </div>
      </section>
    </main>

    <footer><p>&copy; 2026 David Ludeke</p></footer>
  </div>

  <script>
    // Same order as the Reference page: alphabets, then abugidas and
    // syllabaries, then abjads. Keep it in step with SCRIPTS in
    // generate_scripts.py, which is what index.json is built from.
    const SCRIPTS = [
      ['greek', 'Greek'], ['latin', 'Latin'], ['cyrillic', 'Cyrillic'],
      ['hangul', 'Hangul'], ['pinyin', 'Pinyin'],
      ['geez', "Ge'ez"], ['devanagari', 'Devanagari'], ['kana', 'Kana'],
      ['thai', 'Thai'],
      ['arabic', 'Arabic'], ['hebrew', 'Hebrew'], ['farsi', 'Farsi'],
    ];

    /** A row of script buttons, the same shape the quiz uses.
     *  @param pick  called with the slug; returns nothing. */
    function scriptButtons(host, current, pick) {
      host.innerHTML = '';
      SCRIPTS.forEach(([sl, name]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'language-btn' + (sl === current ? ' active' : '');
        b.dataset.slug = sl;
        b.textContent = name;
        b.addEventListener('click', () => {
          [...host.children].forEach(c => c.classList.remove('active'));
          b.classList.add('active');
          pick(sl);
        });
        host.appendChild(b);
      });
    }
    // 0 word · 1 letters · 2 letter IPA · 3 handshapes and SignWriting
    const LAST_STEP = 3;

    let slug = 'greek', data = null, deck = [], at = 0, step = 0;

    /* Ge'ez prints the consonant's hand and the arrow separately, so a card
       shows both. The Japanese pictures have the arrow drawn under the hand
       already, and showing it twice just reads as two movements. */
    const showMove = (doc, m, hand) =>
      !!(m && m.movement) && !(doc && doc.movement_in_handshape && hand);
    let deckMode = 'shuffled', deckNote = '', panel = 'cards';
    const el = id => document.getElementById(id);

    /** Accent-insensitive key, so Greek έ finds ε and Arabic أ finds ا. */
    const bare = s => s.normalize('NFD')
      .replace(/[̀-ͯٓ-ٰٕ]/g, '');

    // Hangul is written in syllable blocks, so 자 has to be taken apart into
    // its jamo before any of them can be looked up. NFD yields conjoining
    // jamo, a different set of codepoints from the standalone ones the
    // alphabet is listed in, hence the two tables.
    const CHO = [...'\u1100\u1101\u1102\u1103\u1104\u1105\u1106\u1107\u1108\u1109\u110a\u110b\u110c\u110d\u110e\u110f\u1110\u1111\u1112'];
    const CHO_C = [...'\u3131\u3132\u3134\u3137\u3138\u3139\u3141\u3142\u3143\u3145\u3146\u3147\u3148\u3149\u314a\u314b\u314c\u314d\u314e'];
    const JUNG = [...'\u1161\u1162\u1163\u1164\u1165\u1166\u1167\u1168\u1169\u116a\u116b\u116c\u116d\u116e\u116f\u1170\u1171\u1172\u1173\u1174\u1175'];
    const JUNG_C = [...'\u314f\u3150\u3151\u3152\u3153\u3154\u3155\u3156\u3157\u3158\u3159\u315a\u315b\u315c\u315d\u315e\u315f\u3160\u3161\u3162\u3163'];
    // all 27 jongseong, the eleven clusters included: without them 값
    // and 읽다 came apart into a jamo the alphabet could not name.
    const JONG = [...'\u11a8\u11a9\u11aa\u11ab\u11ac\u11ad\u11ae\u11af\u11b0\u11b1\u11b2\u11b3\u11b4\u11b5\u11b6\u11b7\u11b8\u11b9\u11ba\u11bb\u11bc\u11bd\u11be\u11bf\u11c0\u11c1\u11c2'];
    const JONG_C = [...'\u3131\u3132\u3133\u3134\u3135\u3136\u3137\u3139\u313a\u313b\u313c\u313d\u313e\u313f\u3140\u3141\u3142\u3144\u3145\u3146\u3147\u3148\u314a\u314b\u314c\u314d\u314e'];

    function jamoOf(ch) {
      // Only Hangul syllable blocks. Any accented letter decomposes under NFD
      // too, and splitting Greek έ into epsilon plus an accent would turn one
      // letter into two tiles.
      const cp = ch.codePointAt(0);
      if (cp < 0xac00 || cp > 0xd7a3) return null;
      const parts = ch.normalize('NFD');
      if (parts === ch) return null;
      const out = [];
      for (const c of parts) {
        let i = CHO.indexOf(c);
        if (i >= 0) { out.push(CHO_C[i]); continue; }
        i = JUNG.indexOf(c);
        if (i >= 0) { out.push(JUNG_C[i]); continue; }
        i = JONG.indexOf(c);
        if (i >= 0) { out.push(JONG_C[i]); continue; }
        out.push(c);
      }
      return out.length ? out : null;
    }

    // A Ge'ez syllable is a consonant in one of seven vowel orders, laid out
    // in blocks of eight. The alphabet lists first order, so round down.
    function geezBase(ch) {
      const cp = ch.codePointAt(0);
      if (cp < 0x1200 || cp > 0x137f) return null;
      // Blocks are eight wide but a consonant has only seven orders. The
      // eighth slot is a labialised syllable of its own, so rounding down
      // from it would hand back the neighbouring consonant and the tile
      // would confidently show the wrong letter.
      if ((cp - 0x1200) % 8 === 7) return null;
      return String.fromCodePoint(0x1200 + Math.floor((cp - 0x1200) / 8) * 8);
    }

    // Devanagari vowel signs are the dependent form of an independent vowel.
    const MATRA = { '\u093e': '\u0906', '\u093f': '\u0907', '\u0940': '\u0908',
                    '\u0941': '\u0909', '\u0942': '\u090a', '\u0943': '\u090b',
                    '\u0947': '\u090f', '\u0948': '\u0910', '\u094b': '\u0913',
                    '\u094c': '\u0914' };

    function shuffle(a) {
      a = a.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function loadScript() {
      data = await (await fetch(`assets/data/scripts/${slug}.json`, { cache: 'no-cache' })).json();
      // index letters by glyph, by its pair, and by accent-stripped forms
      data.index = {};
      data.letters.forEach(L => {
        [L.glyph, L.alt, ...(L.aliases || [])].filter(Boolean).forEach(k => {
          data.index[k] = data.index[k] || L;
          data.index[bare(k)] = data.index[bare(k)] || L;
          data.index[k.toLowerCase()] = data.index[k.toLowerCase()] || L;
          data.index[bare(k).toLowerCase()] = data.index[bare(k).toLowerCase()] || L;
        });
      });
      await buildDeck();
      render();
    }

    // The practice word lists are the "extra" words: whole vocabulary rather
    // than one word per letter. Only two scripts have one.
    const extraCache = {};

    async function extraWords(s) {
      if (!extraCache[s]) {
        const r = await fetch(`assets/data/words/${s}.json`, { cache: 'no-cache' });
        if (!r.ok) return null;
        const j = await r.json();
        extraCache[s] = j.words.map(w => ({
          example_word: w.word,
          example_gloss: w.english,
          romanisation: w.romaji,
          categories: w.categories || []
        }));
      }
      return extraCache[s];
    }

    async function buildDeck() {
      deckNote = '';
      if (deckMode === 'extra') {
        const extra = await extraWords(slug);
        if (!extra) {
          deck = [];
          deckNote = `There is no practice word list for ${data.name} yet.`;
        } else {
          deck = shuffle(extra);
        }
      } else {
        const withWords = data.letters.filter(L => L.example_word);
        // "Alphabetical" means the order the script itself lists its letters,
        // which is how the reference page shows them.
        deck = deckMode === 'alpha' ? withWords : shuffle(withWords);
      }
      at = 0; step = 0;
      el('shuffleBtn').hidden = deckMode === 'alpha';
    }

    function lookup(ch) {
      const plainKana = ch.normalize('NFD').replace(/[\u3099\u309a]/g, '');
      const tries = [ch, bare(ch), ch.toLowerCase(), bare(ch).toLowerCase(),
                     MATRA[ch], geezBase(ch), plainKana];
      for (const t of tries) if (t && data.index[t]) return data.index[t];
      return null;
    }

    function render() {
      const host = el('stage');
      if (!deck.length) {
        host.innerHTML = `<p class="empty">${deckNote || 'No example words here yet.'}</p>`;
        el('progress').textContent = '';
        return;
      }
      const L = deck[at];
      const raw = L.example_word || '';
      // Pinyin entries read "\u7231 (\u00e0i)", and there the romanisation IS the
      // spellable form, so it is what gets broken into letters. Everywhere
      // else the word is already in the script and the romanisation is just
      // a reading to show alongside it.
      const pin = slug === 'pinyin' ? (raw.match(/\(([^)]+)\)/) || [])[1] : null;
      const rom = L.romanisation || pin;
      const word = raw;
      const spell = pin || raw;
      const chars = [...spell].filter(c => !/\s/.test(c))
        .flatMap(c => jamoOf(c) || [c]);

      const letters = chars.map(ch => {
        const m = lookup(ch);
        const sw = m && m.signwriting_image;
        const hand = m && (m.handshape || (m.handshape_variants && Object.values(m.handshape_variants)[0]));
        return `
          <div class="lt${m ? '' : ' unknown'}">
            <div class="ch">${m && m.display_glyph ? m.display_glyph : ch}</div>
            <div class="nm">${m ? (m.name || '') : ''}</div>
            <div class="nm-ipa">${step >= 2 && m && m.name_ipa ? '/' + m.name_ipa + '/' : ''}</div>
            <div class="ip">${step >= 2 && m && (m.ipa || []).length ? '/' + m.ipa.join(', ') + '/' : ''}</div>
            <div class="pics">
              ${step >= 3 && hand ? `<img src="${hand}" alt="handshape" />` : ''}
              ${step >= 3 && showMove(data, m, hand)
                ? `<img class="mv" src="${m.movement.image}" title="${m.movement.label} ${m.movement.name}" alt="${m.movement.description}" />`
                : ''}
              ${step >= 3 && sw ? `<img class="sw" src="${sw}" alt="SignWriting" />` : ''}
            </div>
          </div>`;
      }).join('');

      host.innerHTML = `
        <div class="word">${word}</div>
        ${rom && step >= 1 && rom.toLowerCase() !== (L.example_gloss || '').toLowerCase()
            ? `<div class="gloss">${rom}</div>` : ''}
        <div class="gloss">${step >= 1 ? (L.example_gloss || '') : '&nbsp;'}</div>
        <div class="word-ipa">${step >= 1 && L.example_ipa ? '/' + L.example_ipa + '/' : '&nbsp;'}</div>
        ${step >= 1 ? `<div class="letters">${letters}</div>` : ''}
        <div class="steps">${[0,1,2,3].map(i => `<i class="${i <= step ? 'on' : ''}"></i>`).join('')}</div>`;

      el('progress').textContent =
        `${at + 1} of ${deck.length} · ${data.name}` +
        (deckMode === 'extra' ? ' · practice words' : '');
    }

    function advance() { if (step < LAST_STEP) { step++; render(); } }
    function nextWord(d = 1) {
      at = (at + d + deck.length) % deck.length;
      step = 0; render();
    }

    document.addEventListener('keydown', e => {
      if (panel !== 'cards') return;
      if (/^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); advance(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nextWord(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); nextWord(-1); }
      else if (e.key === 'r' || e.key === 'R') { step = 0; render(); }
    });
    el('stage').addEventListener('click', advance);
    el('nextBtn').addEventListener('click', () => nextWord(1));
    el('shuffleBtn').addEventListener('click', () => { deck = shuffle(deck); at = 0; step = 0; render(); });

    scriptButtons(el('cardScripts'), slug, sl => { slug = sl; loadScript(); });

    const DECKS = [
      ['shuffled', 'Example words \u2014 shuffled'],
      ['alpha',    'Example words \u2014 alphabetical'],
      ['extra',    'Practice word list'],
    ];
    DECKS.forEach(([v, label]) => {
      const row = document.createElement('div');
      row.className = 'category-filter';
      row.innerHTML = `<input type="radio" name="deck" id="deck-${v}" value="${v}"${
        v === deckMode ? ' checked' : ''} />
        <label for="deck-${v}">${label}</label>`;
      row.querySelector('input').addEventListener('change', async () => {
        deckMode = v;
        await buildDeck();
        render();
      });
      el('deckChoices').appendChild(row);
    });

    // ---- Pangrams -----------------------------------------------------
    // A pangram runs the whole alphabet past you in one sentence, which
    // makes it the natural thing both to type and to fingerspell.
    let pgAll = null, pgData = null, pgSlug = 'latin', pgMode = 'type', pgAt = 0;

    function pgIndex(d) {
      const ix = {};
      d.letters.forEach(L => {
        [L.glyph, L.alt, ...(L.aliases || [])].filter(Boolean).forEach(k => {
          for (const v of [k, bare(k), k.toLowerCase(), bare(k).toLowerCase()])
            if (!ix[v]) ix[v] = L;
        });
      });
      return ix;
    }

    function pgLook(ch) {
      if (!pgData) return null;
      const plainKana = ch.normalize('NFD').replace(/[゙゚]/g, '');
      for (const t of [ch, bare(ch), ch.toLowerCase(), bare(ch).toLowerCase(),
                       MATRA[ch], geezBase(ch), plainKana])
        if (t && pgData.index[t]) return pgData.index[t];
      return null;
    }

    /** The characters worth fingerspelling.
        By Unicode category, not a list of punctuation: every script brings
        its own (። ، । 。), plus digits and the zero-width
        joiners Persian uses, and none of those is spelled out. */
    /** The letters to fingerspell, each remembering which character of the
     *  sentence it came from. A Korean syllable is three jamo and one
     *  character, so without that the sentence cannot be followed along. */
    function pgSpell(text) {
      const out = [];
      [...text].forEach((c, at) => {
        for (const j of (jamoOf(c) || [c]))
          if (!/[\p{P}\p{N}\p{Z}\p{C}\p{S}]/u.test(j)) out.push({ ch: j, at });
      });
      return out;
    }

    const pgLetters = text => pgSpell(text).map(x => x.ch);

    // Switching script twice quickly starts two loads; without a token the
    // slower one lands last and the panel shows the script you left.
    let pgReq = 0;

    async function pgLoad() {
      const mine = ++pgReq;
      if (!pgAll) {
        const j = await (await fetch('assets/data/pangrams.json',
          { cache: 'no-cache' })).json();
        pgAll = j.pangrams;
      }
      const d = await (await fetch(`assets/data/scripts/${pgSlug}.json`,
        { cache: 'no-cache' })).json();
      if (mine !== pgReq) return;
      d.index = pgIndex(d);
      pgData = d;
      pgAt = 0;
      pgRender();
    }

    const pgCurrent = () => (pgAll || []).find(p => p.script === pgSlug);

    const pgHasShape = m => !!(m && (m.handshape ||
      (m.handshape_variants && Object.keys(m.handshape_variants).length)));

    function pgShapeCount(text) {
      const L = pgLetters(text);
      return [L.filter(c => pgHasShape(pgLook(c))).length, L.length];
    }

    function pgRender() {
      const host = el('pgStage'), p = pgCurrent();
      if (!p) { host.innerHTML = '<p class="empty">No pangram for this script yet.</p>'; return; }
      const showIpa = el('pgIpa').checked;
      const [withShape, totalLetters] = pgShapeCount(p.text);
      // Cyrillic has no manual alphabet in this reference, so there is
      // nothing to fingerspell; say so instead of offering 46 blanks.
      el('pgSignBtn').disabled = withShape === 0;
      el('pgSignBtn').title = withShape === 0
        ? 'No manual alphabet for this script yet' : '';
      if (withShape === 0 && pgMode === 'sign') {
        pgMode = 'type';
        el('pgTypeBtn').classList.add('on');
        el('pgSignBtn').classList.remove('on');
      }
      const head = `
        <div class="pg-gloss">${p.translation}</div>
        ${showIpa ? `<div class="pg-ipa">/${p.ipa}/</div>` : ''}
        <div class="pg-cover">Reaches <b>${p.covers} of ${p.of}</b> letters${
          p.missing.length ? ' &mdash; missing ' + p.missing.join(' ') : ', a complete pangram'}
          ${withShape === 0
            ? ' &middot; no manual alphabet for this script yet'
            : (withShape < totalLetters
               ? ` &middot; ${withShape} of its ${totalLetters} characters have a handshape`
               : '')}</div>`;

      if (pgMode === 'type') {
        const typed = (el('pgInput') || {}).value || '';
        const chars = [...p.text].map((c, i) => {
          const t = [...typed][i];
          const cls = t === undefined ? (i === [...typed].length ? 'at' : '')
                    : (t === c ? 'ok' : 'bad');
          return `<i class="${cls}">${c === '\n' ? '\n' : c}</i>`;
        }).join('');
        const right = [...typed].filter((t, i) => t === [...p.text][i]).length;
        host.innerHTML = `<div class="pg-text">${chars}</div>${head}
          <textarea class="pg-input" id="pgInput" spellcheck="false"
            placeholder="Type the sentence above">${typed.replace(/</g, '&lt;')}</textarea>
          ${typed && right === [...p.text].length && typed.length === p.text.length
            ? '<p class="pg-done">Done &mdash; every character matched.</p>' : ''}
          <p class="pg-note">${p.note}</p>`;
        const inp = el('pgInput');
        inp.addEventListener('input', () => { pgRender(); el('pgInput').focus(); });
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
        el('pgProgress').textContent = `${right} of ${[...p.text].length} characters`;
      } else {
        const spell = pgSpell(p.text);
        const letters = spell.map(x => x.ch);
        if (pgAt >= letters.length) pgAt = letters.length - 1;
        const ch = letters[pgAt], m = pgLook(ch);
        // the sentence itself, with the character being spelled marked. The
        // jamo strip below cannot stand in for it: 책 is three letters and
        // one character, so the Korean was nowhere on the page.
        const srcAt = (spell[pgAt] || {}).at;
        const full = [...p.text].map((c, i) =>
          `<i class="${i === srcAt ? 'at' : i < srcAt ? 'seen' : ''}">${c}</i>`).join('');
        const hand = m && (m.handshape ||
          (m.handshape_variants && Object.values(m.handshape_variants)[0]));
        host.innerHTML = `<div class="pg-text">${full}</div>${head}
          <div class="pg-sign">
            <div class="big">${m && m.display_glyph ? m.display_glyph : ch}</div>
            <div class="nm">${m ? (m.name || '') : 'not in this alphabet'}</div>
            <div class="ip">${showIpa && m && (m.ipa || []).length ? '/' + m.ipa.join(', ') + '/' : ''}</div>
            <div class="shot">
              ${hand ? `<img src="${hand}" alt="handshape for ${ch}" />` : '<span class="empty">no handshape</span>'}
              ${showMove(pgData, m, hand) ? `<img class="mv" src="${m.movement.image}"
                 title="${m.movement.label} ${m.movement.name}" alt="${m.movement.description}" />` : ''}
            </div>
            <div class="pg-strip">${letters.map((c, i) =>
              `<i class="${i < pgAt ? 'seen' : i === pgAt ? 'at' : ''}">${c}</i>`).join('')}</div>
          </div>
          <p class="pg-note">${p.note}</p>`;
        el('pgProgress').textContent = `${pgAt + 1} of ${letters.length} letters`;
      }
    }

    function pgStep(d) {
      const p = pgCurrent();
      if (!p) return;
      const n = pgLetters(p.text).length;
      pgAt = (pgAt + d + n) % n;
      pgRender();
    }

    scriptButtons(el('pgScripts'), pgSlug, sl => { pgSlug = sl; pgLoad(); });
    el('pgIpa').addEventListener('change', pgRender);
    el('pgTypeBtn').addEventListener('click', () => {
      pgMode = 'type'; el('pgTypeBtn').classList.add('on');
      el('pgSignBtn').classList.remove('on'); pgRender();
    });
    el('pgSignBtn').addEventListener('click', () => {
      pgMode = 'sign'; pgAt = 0; el('pgSignBtn').classList.add('on');
      el('pgTypeBtn').classList.remove('on'); pgRender();
    });
    // arrows walk the fingerspelling; typing keeps its own keys
    document.addEventListener('keydown', e => {
      if (panel !== 'pangram' || pgMode !== 'sign') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); pgStep(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); pgStep(-1); }
    });

    // Three panels, one page. The hash keeps the old Practice Area links
    // working and makes each one something you can link straight to.
    function showPanel(p) {
      panel = ['quiz', 'pangram'].includes(p) ? p : 'cards';
      for (const [name, tab] of [['cards', 'tabCards'], ['quiz', 'tabQuiz'],
                                 ['pangram', 'tabPangram']]) {
        el('panel-' + name).hidden = panel !== name;
        el(tab).classList.toggle('on', panel === name);
      }
      document.querySelector('h1').textContent =
        { quiz: 'Study \u2014 Quiz', pangram: 'Study \u2014 Pangrams' }[panel] || 'Study';
      if (panel === 'pangram' && !pgData) pgLoad();
      if (location.hash.slice(1) !== panel) history.replaceState(null, '', '#' + panel);
    }
    document.querySelectorAll('.modes button').forEach(b =>
      b.addEventListener('click', () => showPanel(b.dataset.panel)));
    window.addEventListener('hashchange', () => showPanel(location.hash.slice(1)));

    showPanel(location.hash.slice(1) || 'cards');
    loadScript();
  </script>
  <script>
    let wordList = [];
    let allWords = [];
    let scriptMapping = {};
    // The same per-letter data the Reference page uses. The quiz's own
    // mapping files only ever covered Greek; this covers every script that
    // has handshapes at all, which is now all ten in the drill.
    let quizScript = null;
    let currentLanguage = 'kana';
    let currentMode = 'script-to-romaji';
    let currentCard = null;
    let reviewQueue = [];
    let currentKeyboardScript = 'hiragana';
    let selectedCategories = new Set();

    // Language-specific configurations
    // Every script now has a word list. The two drills that only compare the
    // word with its romanisation need nothing but that list, so they work for
    // ten of the twelve. English is left out because transliterating Latin
    // into Latin is not a drill, and Mandarin because pinyin already is the
    // romanisation, so both directions ask for what is on the card. Their
    // word lists are still used by the flashcards. The on-screen keyboard needs a glyph-to-romanisation map and
    // the sign drills need a handshape map; where those are missing the
    // keyboard stays hidden and the sign tabs stay greyed out.
    // Reference-page order, minus Latin and pinyin, which have no drill here.
    const LANGS = [
      ['greek',      'Greek',      'GSL', ['lowercase','uppercase'], 'greek-mapping.json'],
      ['cyrillic',   'Russian',    'RSL', ['letters'], null],
      ['hangul',     'Korean',     'KSL', ['letters'], null],
      ['geez',       'Amharic',    'EthSL',['letters'], null],
      ['devanagari', 'Hindi',      'ISL', ['letters'], null],
      ['kana',       'Japanese',   'JSL', ['hiragana','katakana'],   'kana-mapping.json'],
      ['thai',       'Thai',       'TSL', ['letters'], null],
      ['arabic',     'Arabic',     'ArSL',['letters'], null],
      ['hebrew',     'Hebrew',     'ISL', ['letters'], null],
      ['farsi',      'Persian',    'PSL', ['letters'], null]
    ];

    const languageConfig = {};
    const langBar = document.querySelector('#panel-quiz .language-selector');
    LANGS.forEach(([slug, name, sl, scripts, mapping]) => {
      const b = document.createElement('button');
      b.className = 'language-btn' + (slug === 'kana' ? ' active' : '');
      b.dataset.language = slug;
      b.textContent = name;
      langBar.appendChild(b);
      languageConfig[slug] = {
        name, scripts,
        wordFile: `assets/data/words/${slug}.json`,
        mappingFile: mapping,
        wordKey: 'word',
        modeLabels: [`${name} \u2192 Latin`, `Latin \u2192 ${name}`,
                     `${sl} \u2192 ${name}`, `${name} \u2192 ${sl}`],
        modes: ['script-to-romaji', 'romaji-to-script', 'sign-to-script', 'script-to-sign']
      };
    });

    // Spaced repetition intervals (in number of cards)
    const intervals = {
      again: 1,
      hard: 3,
      good: 5,
      easy: 10
    };

    async function loadData(language = currentLanguage) {
      const config = languageConfig[language];
      try {
        const fetchPromises = [
          fetch(config.wordFile),
          config.mappingFile ? fetch(config.mappingFile) : Promise.resolve(null)
        ];

        const [wordsResponse, mappingResponse] = await Promise.all(fetchPromises);

        if (!wordsResponse.ok) {
          throw new Error(`Failed to fetch ${config.wordFile}: ${wordsResponse.status}`);
        }
        if (config.mappingFile && !mappingResponse.ok) {
          throw new Error(`Failed to fetch ${config.mappingFile}: ${mappingResponse.status}`);
        }

        const wordsData = await wordsResponse.json();
        allWords = wordsData.words;

        quizScript = null;
        try {
          const sd = await (await fetch(`assets/data/scripts/${currentLanguage}.json`,
            { cache: 'no-cache' })).json();
          sd.index = pgIndex(sd);
          quizScript = sd;
        } catch (e) {
          // the strip just stays hidden
        }
        scriptMapping = mappingResponse ? await mappingResponse.json() : {};

        currentKeyboardScript = config.scripts[0];
        buildCategoryFilters();
        updateModeLabels();
        updateModeTabs();
        buildScriptKeyboard();
        filterWordsByCategory();
        initializeQueue();
        showNextCard();
      } catch (error) {
        console.error('Error loading data:', error);
        const errorMsg = `Failed to load ${language} data files.\n\nError: ${error.message}\n\nNote: If you're opening this file directly (file:// protocol), you need to run a local web server. Try:\n  python3 -m http.server 8000\nThen open: http://localhost:8000/practice.html`;
        alert(errorMsg);
      }
    }

    function updateModeLabels() {
      const config = languageConfig[currentLanguage];
      for (let i = 0; i < 4; i++) {
        const label = document.getElementById(`modeLabel${i + 1}`);
        if (label) {
          label.textContent = config.modeLabels[i] || '';
        }
      }
    }

    // Reading a fingerspelled word only works when every letter of it can be
    // shown, so that drill needs a decent number of words it can ask about.
    const SIGN_READING_MINIMUM = 5;

    function updateModeTabs() {
      const config = languageConfig[currentLanguage];
      const tabs = document.querySelectorAll('.tab');
      const canSign = !!quizScript &&
        quizScript.letters.some(L => L.handshape || L.signwriting_image);
      const readable = canSign ? allWords.filter(signableWord).length : 0;

      tabs.forEach((tab, index) => {
        const mode = config.modes[index];
        if (index >= config.modes.length) {
          tab.style.display = 'none';
          return;
        }
        tab.style.display = 'inline-block';
        let why = '';
        if (mode === 'script-to-sign' && !canSign) {
          why = `No manual alphabet for ${config.name} here yet.`;
        } else if (mode === 'sign-to-script' && readable < SIGN_READING_MINIMUM) {
          why = canSign
            ? `Only ${readable} of ${allWords.length} words can be spelled in `
              + `full, so there is not enough here to read from.`
            : `No manual alphabet for ${config.name} here yet.`;
        }
        tab.disabled = !!why;
        tab.title = why;
        tab.style.opacity = why ? '0.5' : '1';
        tab.style.cursor = why ? 'not-allowed' : 'pointer';
      });

      // A mode can stop being available when the language changes
      const active = document.querySelector('.tab.active');
      if (active && active.disabled) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tabs[0].classList.add('active');
        currentMode = config.modes[0];
      }
    }

    function buildCategoryFilters() {
      // Extract all unique categories from words
      const categoriesSet = new Set();
      allWords.forEach(word => {
        if (word.categories) {
          word.categories.forEach(cat => categoriesSet.add(cat));
        }
      });

      const categories = Array.from(categoriesSet).sort();

      // Select all categories by default
      selectedCategories = new Set(categories);

      const filtersContainer = document.getElementById('categoryFilters');
      if (!filtersContainer) {
        console.error('categoryFilters element not found!');
        return;
      }

      filtersContainer.innerHTML = '';

      categories.forEach(category => {
        const filterDiv = document.createElement('div');
        filterDiv.className = 'category-filter';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `category-${category}`;
        checkbox.value = category;
        checkbox.checked = true;
        checkbox.addEventListener('change', handleCategoryChange);

        const label = document.createElement('label');
        label.htmlFor = `category-${category}`;
        label.textContent = category;

        filterDiv.appendChild(checkbox);
        filterDiv.appendChild(label);
        filtersContainer.appendChild(filterDiv);
      });
    }

    function handleCategoryChange(event) {
      const category = event.target.value;
      if (event.target.checked) {
        selectedCategories.add(category);
      } else {
        selectedCategories.delete(category);
      }
      filterWordsByCategory();
      initializeQueue();
      showNextCard();
    }

    function filterWordsByCategory() {
      if (selectedCategories.size === 0) {
        wordList = [];
        return;
      }

      wordList = allWords.filter(word => {
        if (!word.categories || word.categories.length === 0) {
          return false;
        }
        if (currentMode === 'sign-to-script' && !signableWord(word)) {
          return false;
        }
        return word.categories.some(cat => selectedCategories.has(cat));
      });

      // Randomize the word list
      wordList = shuffleArray([...wordList]);
    }

    function shuffleArray(array) {
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function initializeQueue() {
      reviewQueue = wordList.map((word, index) => ({
        ...word,
        id: index,
        nextReview: 0
      }));
      updateQueueCount();
    }

    function updateQueueCount() {
      document.getElementById('queueCount').textContent = reviewQueue.length;
    }

    function showNextCard() {
      if (reviewQueue.length === 0) {
        initializeQueue();
      }

      if (reviewQueue.length === 0) {
        // No words available for selected categories
        const questionEl = document.getElementById('question');
        questionEl.textContent = 'No words available. Please select at least one category.';
        return;
      }

      // Sort by nextReview and get the first card
      reviewQueue.sort((a, b) => a.nextReview - b.nextReview);
      currentCard = reviewQueue[0];

      const questionEl = document.getElementById('question');
      const hintEl = document.getElementById('hint');
      const answerEl = document.getElementById('answer');
      const feedbackEl = document.getElementById('feedback');
      const correctAnswerEl = document.getElementById('correctAnswer');
      const revealButton = document.getElementById('revealButton');
      const answerImageContainer = document.getElementById('answerImageContainer');
      const answerImages = document.getElementById('answerImages');

      // Reset display
      answerEl.value = '';
      answerEl.className = 'answer-input';
      feedbackEl.textContent = '';
      correctAnswerEl.textContent = '';
      hintEl.textContent = '';
      answerImageContainer.style.display = 'none';
      answerImages.innerHTML = '';
      answerImages.className = '';
      revealButton.style.display = 'none';
      document.getElementById('wordIpa').textContent = '';
      const shapes = document.getElementById('answerShapes');
      shapes.className = 'answer-shapes';
      shapes.innerHTML = '';
      const vowelHint = document.getElementById('vowelHint');
      vowelHint.style.display = 'none';
      vowelHint.disabled = false;
      vowelHint.textContent = 'Show vowel marks';
      document.getElementById('difficultyButtons').style.display = 'none';
      document.getElementById('kanaKeyboard').classList.remove('visible');

      const config = languageConfig[currentLanguage];
      const scriptKey = config.wordKey;

      switch (currentMode) {
        case 'script-to-romaji':
          // Show script, answer with Latin letters
          questionEl.textContent = currentCard[scriptKey];
          questionEl.style.display = 'block';
          if (currentCard.vocalised) vowelHint.style.display = 'inline-block';
          answerEl.style.display = 'block';
          answerEl.focus();
          break;

        case 'romaji-to-script':
          // Show Latin letters, answer with script
          questionEl.textContent = currentCard.romaji;
          questionEl.style.display = 'block';
          answerEl.style.display = 'block';
          document.getElementById('kanaKeyboard').classList.add('visible');
          answerEl.focus();
          break;

        case 'sign-to-script': {
          // Read the fingerspelling and type the word. Unlabelled: the letter
          // under each hand is what is being asked for.
          const cells = quizCells(currentCard[scriptKey]);
          if (cells.length) {
            questionEl.style.display = 'none';
            answerImages.innerHTML = '';
            answerImages.className = 'answer-shapes on asking';
            answerImages.innerHTML = shapeStrip(cells, false);
            answerImageContainer.style.display = 'block';
            answerEl.style.display = 'block';
            document.getElementById('kanaKeyboard').classList.add('visible');
            answerEl.focus();
          }
          break;
        }

        case 'script-to-sign':
          // Show script, reveal handshapes
          questionEl.textContent = currentCard[scriptKey];
          questionEl.style.display = 'block';
          answerEl.style.display = 'none';
          revealButton.style.display = 'inline-block';
          break;
      }

      updateQueueCount();
    }

    /** The letters of a word, in the order they are fingerspelled.
     *
     * A Hangul syllable is a block of two or three jamo and is spelled as
     * those, so it is taken apart first. Punctuation, spaces and digits are
     * not spelled at all.
     */
    function quizSpell(word) {
      return [...(word || '')]
        .flatMap(c => jamoOf(c) || [c])
        .filter(c => !/[\p{P}\p{N}\p{Z}\p{C}\p{S}]/u.test(c));
    }

    function quizLook(ch) {
      if (!quizScript) return null;
      const plainKana = ch.normalize('NFD').replace(/[\u3099\u309a]/g, '');
      for (const t of [ch, bare(ch), ch.toLowerCase(), bare(ch).toLowerCase(),
                       MATRA[ch], geezBase(ch), plainKana])
        if (t && quizScript.index[t]) return quizScript.index[t];
      return null;
    }

    /** Draw the word's handshapes under the answer, so a fingerspelled
     *  attempt can be checked against the same card as the typed one. */
    function showAnswerShapes(word) {
      const host = document.getElementById('answerShapes');
      host.className = 'answer-shapes';
      host.innerHTML = '';
      if (!quizScript) return;
      const cells = quizCells(word);
      if (!cells.length) return;
      const missing = cells.filter(c => !c.pic).length;
      host.innerHTML = '<span class="k">Fingerspelled</span>' + shapeStrip(cells, true) +
        (missing ? `<p class="miss">${missing} of ${cells.length} ${
          missing === 1 ? 'letter has' : 'letters have'
        } no sign in this alphabet yet.</p>` : '');
      host.classList.add('on');
    }

    /** One cell per fingerspelled letter: the picture, and the movement
     *  arrow where the picture does not already contain it. */
    function quizCells(word) {
      return quizSpell(word).map(ch => {
        const L = quizLook(ch);
        const hand = L && (L.handshape ||
          (L.handshape_variants && Object.values(L.handshape_variants)[0]));
        // Russian has no manual-alphabet photographs: the RSL chart is drawn
        // in SignWriting, so that is what its letters carry.
        const pic = hand || (L && L.signwriting_image) || null;
        return { ch, L, hand, pic,
                 mv: showMove(quizScript, L, hand) ? L.movement : null };
      });
    }

    /** @param labelled  false for the drill that asks you to read the
     *  fingerspelling, where the letter under the hand would be the answer.
     *  The title and alt text are blanked there for the same reason. */
    function shapeStrip(cells, labelled) {
      return `<div class="strip">${cells.map(c => {
        const name = (c.L && c.L.name) || c.ch;
        const what = c.hand ? name : c.pic ? name + ' \u2014 SignWriting' : name;
        return `<div class="sh"${labelled ? ` title="${what}"` : ''}>${c.pic
          ? `<img class="${c.hand ? '' : 'sw'}" src="${c.pic}" alt="${
              labelled ? 'sign for ' + c.ch : 'a fingerspelled letter'}" />`
          : '<span class="none">no<br>handshape</span>'}${c.mv
          ? `<img class="mv" src="${c.mv.image}" alt="${c.mv.description}" />` : ''}${
          labelled ? `<span class="ch">${(c.L && c.L.display_glyph) || c.ch}</span>` : ''}</div>`;
      }).join('')}</div>`;
    }

    const signableWord = w => {
      const cells = quizCells(w && w.word);
      return cells.length > 0 && cells.every(c => c.pic);
    };

    function buildScriptKeyboard() {
      const hasKeyboard = !!languageConfig[currentLanguage].mappingFile;
      document.getElementById('kanaKeyboard').style.display = hasKeyboard ? '' : 'none';
      const kanaGrid = document.getElementById('kanaGrid');
      // clear first, so switching to a script without a keyboard does not
      // leave the previous script's keys sitting in the hidden grid
      kanaGrid.innerHTML = '';
      if (!hasKeyboard) return;

      const scriptChars = scriptMapping[currentKeyboardScript];

      if (scriptChars) {
        for (const [char, romaji] of Object.entries(scriptChars)) {
          const button = document.createElement('button');
          button.className = 'kana-key';
          button.textContent = char;
          button.dataset.char = char;
          button.addEventListener('click', (e) => {
            e.preventDefault();
            const answerInput = document.getElementById('answer');
            answerInput.value += char;
            // Don't call focus() to prevent page from jumping
          });
          kanaGrid.appendChild(button);
        }
      }

      // Update keyboard tabs
      const config = languageConfig[currentLanguage];
      const keyboardTabs = document.querySelectorAll('.keyboard-tab');
      keyboardTabs.forEach((tab, index) => {
        if (index < config.scripts.length) {
          tab.style.display = 'block';
          tab.textContent = config.scripts[index].charAt(0).toUpperCase() + config.scripts[index].slice(1);
          tab.dataset.script = config.scripts[index];
        } else {
          tab.style.display = 'none';
        }
      });
    }

    function checkAnswer() {
      const userAnswer = document.getElementById('answer').value.trim().toLowerCase();
      const answerEl = document.getElementById('answer');
      const feedbackEl = document.getElementById('feedback');
      const correctAnswerEl = document.getElementById('correctAnswer');
      const hintEl = document.getElementById('hint');

      const config = languageConfig[currentLanguage];
      const scriptKey = config.wordKey;

      let correctAnswer;
      let correctAnswerDisplay;
      if (currentMode === 'script-to-romaji') {
        correctAnswerDisplay = currentCard.romaji;
        correctAnswer = currentCard.romaji.toLowerCase();
      } else {
        correctAnswerDisplay = currentCard[scriptKey];
        correctAnswer = currentCard[scriptKey].toLowerCase();
      }

      const isCorrect = userAnswer === correctAnswer;

      // Show how it is said, then what it means
      document.getElementById('wordIpa').textContent =
        currentCard.ipa ? `/${currentCard.ipa}/` : '';
      hintEl.textContent = `(${currentCard.english})`;

      if (isCorrect) {
        answerEl.className = 'answer-input correct';
        feedbackEl.textContent = '✓ Correct!';
        feedbackEl.style.color = '#28a745';
      } else {
        answerEl.className = 'answer-input incorrect';
        feedbackEl.textContent = '✗ Incorrect';
        feedbackEl.style.color = '#dc3545';
        correctAnswerEl.textContent = `Correct answer: ${correctAnswerDisplay}`;
      }

      showAnswerShapes(currentCard[config.wordKey]);

      document.getElementById('difficultyButtons').style.display = 'flex';
    }

    function handleDifficulty(difficulty) {
      const interval = intervals[difficulty];

      // Remove current card from queue
      reviewQueue.shift();

      // Calculate when this card should appear again
      currentCard.nextReview = interval;

      // Decrement all nextReview counters
      reviewQueue.forEach(card => {
        if (card.nextReview > 0) card.nextReview--;
      });

      // Add card back to queue
      reviewQueue.push(currentCard);

      showNextCard();
    }

    // Event listeners
    // Language selector
    document.querySelectorAll('#panel-quiz .language-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const button = e.currentTarget;
        const newLanguage = button.dataset.language;

        // Only reload if language actually changed
        if (newLanguage !== currentLanguage) {
          document.querySelectorAll('#panel-quiz .language-btn').forEach(b => b.classList.remove('active'));
          button.classList.add('active');
          currentLanguage = newLanguage;
          loadData(currentLanguage);
        }
      });
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        const button = e.currentTarget;
        if (button.disabled) return;

        const modeIndex = parseInt(button.dataset.modeIndex);
        const config = languageConfig[currentLanguage];
        const newMode = config.modes[modeIndex];

        // Only update if mode actually changed
        if (newMode !== currentMode) {
          const wasReading = currentMode === 'sign-to-script';
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          button.classList.add('active');
          currentMode = newMode;
          // the reading drill holds a smaller deck, so crossing into or out
          // of it has to rebuild the queue
          if (wasReading !== (newMode === 'sign-to-script')) {
            filterWordsByCategory();
            initializeQueue();
          }
          showNextCard();
        }
      });
    });

    document.getElementById('answer').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const diffButtons = document.getElementById('difficultyButtons');
        if (diffButtons.style.display === 'none') {
          checkAnswer();
        } else {
          handleDifficulty('good');
        }
      }
    });

    document.querySelectorAll('.difficulty-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        handleDifficulty(e.target.dataset.difficulty);
      });
    });

    // Keyboard tab switching
    document.querySelectorAll('.keyboard-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        document.querySelectorAll('.keyboard-tab').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentKeyboardScript = e.target.dataset.script;
        buildScriptKeyboard();
      });
    });

    // Special keyboard keys
    document.getElementById('backspaceKey').addEventListener('click', (e) => {
      e.preventDefault();
      const answerInput = document.getElementById('answer');
      answerInput.value = answerInput.value.slice(0, -1);
      // Don't call focus() to prevent page from jumping
    });

    document.getElementById('clearKey').addEventListener('click', (e) => {
      e.preventDefault();
      const answerInput = document.getElementById('answer');
      answerInput.value = '';
      // Don't call focus() to prevent page from jumping
    });

    // Reveal button for sign language mode
    function revealHandshapes() {
      if (currentMode !== 'script-to-sign') return;
      const config = languageConfig[currentLanguage];
      document.getElementById('wordIpa').textContent =
        currentCard.ipa ? `/${currentCard.ipa}/` : '';
      document.getElementById('hint').textContent = `(${currentCard.english})`;
      showAnswerShapes(currentCard[config.wordKey]);
      document.getElementById('revealButton').style.display = 'none';
      document.getElementById('difficultyButtons').style.display = 'flex';
    }

    document.getElementById('revealButton').addEventListener('click', revealHandshapes);
    document.getElementById('vowelHint').addEventListener('click', function () {
      if (!currentCard || !currentCard.vocalised) return;
      document.getElementById('question').textContent = currentCard.vocalised;
      this.disabled = true;
      this.textContent = 'Vowel marks shown';
      document.getElementById('answer').focus();
    });

    // Global keyboard handler for Enter and Space in script-to-sign mode
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('panel-quiz').hidden) return;
      if (currentMode === 'script-to-sign') {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); // Prevent space from scrolling the page

          const revealButton = document.getElementById('revealButton');
          const diffButtons = document.getElementById('difficultyButtons');

          // If reveal button is visible, click it
          if (revealButton.style.display !== 'none' && revealButton.style.display !== '') {
            revealHandshapes();
          }
          // If difficulty buttons are visible, click "Good"
          else if (diffButtons.style.display === 'flex') {
            handleDifficulty('good');
          }
        }
      }
    });

    // Initialize
    loadData();
  </script>
</body>
</html>
