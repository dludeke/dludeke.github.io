<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Country Name Signs</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    main {
      padding: 0 !important;
    }

    .signs-content {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .continent-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .continent-btn {
      padding: 0.6rem 1.1rem;
      background: #e0e0e0;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .continent-btn.active {
      background: #28a745;
      color: white;
    }

    .continent-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .game-layout {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
    }

    .card-column {
      flex: 1;
      min-width: 0;
    }

    .quiz-card {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .flag-wrap {
      margin-bottom: 1.5rem;
    }

    .flag-wrap img {
      width: 280px;
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    .prompt {
      font-size: 1.15rem;
      color: #555;
      margin-bottom: 1.5rem;
    }

    .hint-stack {
      min-height: 2rem;
      margin-bottom: 1.5rem;
    }

    .hint-line {
      margin: 0.5rem 0;
      font-size: 1.05rem;
    }

    .hint-label {
      color: #888;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: block;
      margin-bottom: 0.15rem;
    }

    .hint-native {
      font-size: 2rem;
      font-weight: bold;
    }

    .hint-english {
      font-size: 1.6rem;
      font-weight: bold;
      color: #007bff;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.7rem 1.3rem;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
    }

    .btn-hint { background: #6c757d; }
    .btn-reveal { background: #007bff; }
    .btn-next { background: #28a745; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .side-rail {
      width: 380px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .map-panel,
    .list-panel {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 1rem;
    }

    .map-panel h3,
    .list-panel h3 {
      margin: 0 0 0.5rem;
      font-size: 1rem;
    }

    .country-filter {
      width: 100%;
      box-sizing: border-box;
      padding: 0.4rem 0.6rem;
      border: 1px solid #d8dde2;
      border-radius: 4px;
      font-size: 0.9rem;
      font-family: inherit;
      margin-bottom: 0.5rem;
    }

    .country-list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
    }

    .country-list li { margin: 0; }

    .country-list button {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font: inherit;
      font-size: 0.9rem;
      color: #234;
      padding: 0.3rem 0.45rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .country-list button:hover { background: #e9eef3; }

    .country-list button.active {
      background: #007bff;
      color: white;
      font-weight: bold;
    }

    .country-list .tag {
      font-size: 0.72rem;
      color: #999;
      flex-shrink: 0;
    }

    .country-list button.active .tag { color: #dbeafe; }

    .country-list .assumed { color: #c0c6cc; font-style: italic; }
    .country-list button.active .assumed { color: #cfe3ff; }

    .country-list .no-video { color: #b02a37; }
    .country-list button.active .no-video { color: #ffd9dc; }

    .country-list .list-group {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8a939b;
      font-weight: bold;
      padding: 0.6rem 0.45rem 0.2rem;
    }

    .country-list .list-group:first-child { padding-top: 0; }

    .list-empty {
      font-size: 0.85rem;
      color: #999;
      padding: 0.4rem 0.45rem;
    }

    .map-panel svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .map-placeholder {
      color: #999;
      font-size: 0.9rem;
      text-align: center;
      padding: 3rem 1rem;
    }

    .country-base { fill: #dfe3e6; stroke: #fff; stroke-width: 0.4; }
    .country-target { fill: #e8590c; stroke: #fff; stroke-width: 0.5; }
    .target-ring { fill: none; stroke: #e8590c; stroke-width: 2; }

    .reveal-panel {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #eee;
    }

    .reveal-panel iframe,
    .reveal-panel video,
    .reveal-panel img.sign-media {
      width: 100%;
      max-width: 480px;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 6px;
      background: #000;
    }

    .sign-meta {
      font-size: 0.9rem;
      color: #666;
      margin-top: 0.75rem;
    }

    .missing-box {
      background: #fff3cd;
      border: 1px solid #ffe69c;
      border-radius: 6px;
      padding: 1.25rem;
      color: #664d03;
    }

    .missing-box strong { display: block; margin-bottom: 0.4rem; }

    .missing-box a { color: #664d03; }

    .progress {
      text-align: center;
      color: #666;
      margin-top: 1.5rem;
      font-size: 0.95rem;
    }

    .coverage {
      max-width: 1100px;
      margin: 2rem auto 0;
      padding: 1rem 2rem 0;
      border-top: 1px solid #eee;
      font-size: 0.9rem;
      color: #666;
    }

    .coverage-bar {
      display: flex;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin: 0.5rem 0;
      background: #eee;
    }

    .seg-verified { background: #28a745; }
    .seg-review { background: #ffc107; }
    .seg-missing { background: #dc3545; }

    .coverage-legend {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 0.35rem;
    }

    .ts-controls {
      margin-top: 0.85rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
      justify-content: center;
    }

    .ts-btn {
      font-size: 0.85rem;
      font-weight: bold;
      border: 1px solid #cfe0f5;
      background: #f4f8fd;
      color: #0056b3;
      border-radius: 4px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
    }

    .ts-btn:hover { background: #e7f0fb; }

    .ts-btn.clear {
      border-color: #f2d0d0;
      background: #fdf5f5;
      color: #a02020;
    }

    .ts-readout {
      font-size: 0.85rem;
      color: #555;
      font-variant-numeric: tabular-nums;
    }

    .ts-readout .set { color: #1a7f37; font-weight: bold; }
    .ts-readout .unset { color: #999; }

    .rate-note {
      font-size: 0.8rem;
      color: #888;
      margin-top: 0.4rem;
    }

    .export-row {
      margin-top: 0.85rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .export-count { font-size: 0.85rem; color: #555; }

    @media (max-width: 860px) {
      .game-layout { flex-direction: column; }
      .side-rail { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Country Name Signs</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="art.html">Art Portfolio</a></li>
          <li><a href="publications.html">Publications</a></li>
          <li><a href="practice.html">Practice Area</a></li>
          <li><a href="signs.html">Country Signs</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="signs-content">
        <div class="continent-selector" id="continentSelector"></div>

        <div class="game-layout">
          <div class="card-column">
            <div class="quiz-card">
              <div class="flag-wrap">
                <img id="flagImg" alt="Flag of the country to sign" />
              </div>

              <p class="prompt">Sign this country&rsquo;s name.</p>

              <div class="hint-stack" id="hintStack"></div>

              <div class="controls">
                <button class="btn btn-hint" id="hintBtn">Hint</button>
                <button class="btn btn-reveal" id="revealBtn">Reveal Sign</button>
                <button class="btn btn-next" id="nextBtn">Next</button>
              </div>

              <div class="reveal-panel" id="revealPanel" hidden></div>
            </div>

            <div class="progress" id="progress"></div>
          </div>

          <aside class="side-rail">
            <div class="map-panel">
              <h3>Map</h3>
              <div id="mapHost">
                <div class="map-placeholder">Ask for a hint to see the country on the map.</div>
              </div>
            </div>

            <div class="list-panel">
              <h3>Jump to a country</h3>
              <input type="search" id="countryFilter" class="country-filter"
                     placeholder="Filter&hellip;" autocomplete="off" />
              <ul class="country-list" id="countryList"></ul>
            </div>
          </aside>
        </div>

        <div class="coverage" id="coverage"></div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 David Ludeke</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // Continents are added one data file at a time. `file: null` means the data
    // file does not exist yet, so the button renders disabled.
    const CONTINENTS = [
      { key: 'north-america', label: 'North America', file: 'assets/data/country-signs-north-america.json' },
      { key: 'south-america', label: 'South America', file: 'assets/data/country-signs-south-america.json' },
      { key: 'europe', label: 'Europe', file: 'assets/data/country-signs-europe.json' },
      { key: 'asia', label: 'Asia', file: 'assets/data/country-signs-asia.json' },
      { key: 'africa', label: 'Africa', file: 'assets/data/country-signs-africa.json' },
      { key: 'oceania', label: 'Oceania', file: 'assets/data/country-signs-oceania.json' }
    ];

    const HINT_MAP = 0, HINT_NATIVE = 1, HINT_ENGLISH = 2, HINT_DONE = 3;

    // Signs are easier to read slowed down; every clip plays at this rate.
    const PLAYBACK_RATE = 0.75;

    // Assumed window of the sign within a Sign Polyglot clip, used until a
    // country is reviewed and given its own marks. Set both to null to turn
    // the assumption off and play every unreviewed clip from the top.
    const DEFAULT_START = 7;
    const DEFAULT_END = 10;

    // Timestamps captured while reviewing are held here first. The JSON files
    // are static on GitHub Pages so the page cannot write them directly;
    // "Export" hands back a file to fold into the repo permanently.
    const LS_KEY = 'countrySignTimestamps.v1';

    let worldTopo = null;     // shared across continents, fetched once
    let countryFeatures = []; // GeoJSON features keyed later by numeric id
    let deck = [];
    let deckIndex = 0;
    let hintLevel = HINT_MAP;
    let activeContinent = null;
    let ytApiReady = false;
    let ytPlayer = null;

    window.onYouTubeIframeAPIReady = () => { ytApiReady = true; };

    function loadOverrides() {
      try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveOverride(iso2, patch) {
      const all = loadOverrides();
      const entry = Object.assign({}, all[iso2], patch);
      // Drop keys that were cleared so the export stays tidy.
      Object.keys(entry).forEach(k => { if (entry[k] === null) delete entry[k]; });
      if (Object.keys(entry).length) all[iso2] = entry;
      else delete all[iso2];
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(all));
      } catch (e) {
        /* private browsing or blocked storage: overrides just won't persist */
      }
      renderExportRow();
    }

    /** Effective timestamps: a locally captured value wins over the data file. */
    function marks(c) {
      const o = loadOverrides()[c.iso2] || {};
      const s = c.sign || {};
      const pick = (a, b) => (Number.isFinite(a) ? a : (Number.isFinite(b) ? b : null));
      const start = pick(o.start_seconds, s.start_seconds);
      const end = pick(o.end_seconds, s.end_seconds);

      // The Sign Polyglot's clips share a fixed intro, so the sign itself lands
      // in the same window on nearly all of them. Applied only when neither
      // mark has been set for this country: a half-set pair means someone is
      // curating it, and defaulting the other half could put end before start.
      const useDefault = start === null && end === null && !!s.video_url;

      return {
        start: useDefault ? DEFAULT_START : start,
        end: useDefault ? DEFAULT_END : end,
        isDefault: useDefault,
        local: Number.isFinite(o.start_seconds) || Number.isFinite(o.end_seconds)
      };
    }

    function fmt(s) {
      if (!Number.isFinite(s)) return null;
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return `${m}:${String(r).padStart(2, '0')}`;
    }

    const el = {
      selector: document.getElementById('continentSelector'),
      flag: document.getElementById('flagImg'),
      hints: document.getElementById('hintStack'),
      hintBtn: document.getElementById('hintBtn'),
      revealBtn: document.getElementById('revealBtn'),
      nextBtn: document.getElementById('nextBtn'),
      revealPanel: document.getElementById('revealPanel'),
      mapHost: document.getElementById('mapHost'),
      progress: document.getElementById('progress'),
      coverage: document.getElementById('coverage')
    };

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function current() {
      return deck[deckIndex];
    }

    async function loadWorld() {
      if (worldTopo) return;
      const res = await fetch('assets/data/countries-50m.json');
      worldTopo = await res.json();
      countryFeatures = topojson.feature(worldTopo, worldTopo.objects.countries).features;
    }

    async function loadContinent(cfg) {
      const res = await fetch(cfg.file);
      const data = await res.json();
      activeContinent = { cfg, data };
      deck = shuffle(data.countries);
      deckIndex = 0;
      renderCoverage(data);
      renderCard();
      renderCountryList();
    }

    function renderSelector() {
      el.selector.innerHTML = '';
      CONTINENTS.forEach(c => {
        const b = document.createElement('button');
        b.className = 'continent-btn';
        b.textContent = c.label;
        if (!c.file) {
          b.disabled = true;
          b.title = 'Data not added yet';
        } else {
          b.addEventListener('click', () => {
            document.querySelectorAll('.continent-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            loadContinent(c);
          });
        }
        if (activeContinent && activeContinent.cfg.key === c.key) b.classList.add('active');
        el.selector.appendChild(b);
      });
    }

    function renderCard() {
      const c = current();
      if (!c) return;
      hintLevel = HINT_MAP;
      el.flag.src = `https://flagcdn.com/w640/${c.iso2}.png`;
      el.flag.alt = 'Flag of the country to sign';
      el.hints.innerHTML = '';
      el.revealPanel.hidden = true;
      el.revealPanel.innerHTML = '';
      el.hintBtn.disabled = false;
      el.hintBtn.textContent = 'Hint: show on map';
      el.mapHost.innerHTML = '<div class="map-placeholder">Ask for a hint to see the country on the map.</div>';
      el.progress.textContent = `${deckIndex + 1} of ${deck.length} — ${activeContinent.data.continent}`;
    }

    function addHintLine(label, value, cls) {
      const d = document.createElement('div');
      d.className = 'hint-line';
      d.innerHTML = `<span class="hint-label">${label}</span><span class="${cls}"></span>`;
      d.querySelector('span:last-child').textContent = value;
      el.hints.appendChild(d);
    }

    function nextHint() {
      const c = current();
      if (hintLevel === HINT_MAP) {
        drawMap(c);
        hintLevel = HINT_NATIVE;
        // In much of the Americas the native name is identical to the English
        // one, which makes that rung of the ladder a giveaway. Say so plainly
        // rather than pretending it is a separate clue.
        const same = c.name_native.toLowerCase() === c.name_en.toLowerCase();
        el.hintBtn.textContent = same ? 'Hint: native name (same as English)' : 'Hint: native name';
      } else if (hintLevel === HINT_NATIVE) {
        addHintLine(`Native name · ${c.native_language}`, c.name_native, 'hint-native');
        hintLevel = HINT_ENGLISH;
        el.hintBtn.textContent = 'Hint: English name';
      } else if (hintLevel === HINT_ENGLISH) {
        addHintLine('English name', c.name_en, 'hint-english');
        hintLevel = HINT_DONE;
        el.hintBtn.disabled = true;
        el.hintBtn.textContent = 'No more hints';
      }
    }

    function drawMap(c) {
      if (!countryFeatures.length) {
        el.mapHost.innerHTML = '<div class="map-placeholder">Map data unavailable.</div>';
        return;
      }
      const target = countryFeatures.find(f => f.id === c.m49);
      const latlng = c.latlng && c.latlng.length === 2 ? c.latlng : null;
      if (!target && !latlng) {
        el.mapHost.innerHTML = '<div class="map-placeholder">No map shape for this country.</div>';
        return;
      }

      const ids = new Set(activeContinent.data.countries.map(x => x.m49));
      const regional = countryFeatures.filter(f => ids.has(f.id));
      const collection = { type: 'FeatureCollection', features: regional };

      const w = 348, h = 300;

      // Fitting the whole continent renders a Caribbean island at a couple of
      // pixels. Instead frame each country on its own scale: a few times its
      // own size, floored so tiny states still get surrounding context and
      // capped so the view never zooms out past the continent.
      const lonSpan = g => {
        const b = d3.geoBounds(g);
        let d = b[1][0] - b[0][0];
        if (d < 0) d += 360;          // bounds that cross the antimeridian
        return Math.max(d, b[1][1] - b[0][1]);
      };

      const MIN_SPAN_DEG = 6;   // never tighter than this, so there is context
      const CONTEXT = 3.5;      // country fills roughly 1/CONTEXT of the frame

      const center = target ? d3.geoCentroid(target) : [latlng[1], latlng[0]];
      const own = target ? lonSpan(target) : 0;
      const span = Math.min(
        Math.max(own * CONTEXT, MIN_SPAN_DEG),
        lonSpan(collection)
      );

      // A square window around the country, given as its two opposite corners.
      // Deliberately a MultiPoint rather than a Polygon: d3 treats spherical
      // polygons as winding-sensitive, and a box wound the wrong way is read as
      // the whole globe minus the box, which silently fits the entire world.
      const half = span / 2;
      const clampLat = v => Math.max(-84, Math.min(84, v));
      const frame = {
        type: 'MultiPoint',
        coordinates: [
          [center[0] - half, clampLat(center[1] - half)],
          [center[0] + half, clampLat(center[1] + half)]
        ]
      };

      // Rotating to the framed centre also keeps Oceania from smearing across
      // the antimeridian.
      const projection = d3.geoMercator()
        .rotate([-center[0], 0])
        .fitExtent([[6, 6], [w - 6, h - 6]], frame);
      const path = d3.geoPath(projection);

      const svg = d3.create('svg')
        .attr('viewBox', `0 0 ${w} ${h}`)
        .attr('role', 'img')
        .attr('aria-label', 'Map with the target country highlighted');

      // Draw every landmass, not just this continent's: once the view zooms
      // into the Caribbean the nearest orienting coastlines are South
      // American, and omitting them leaves the country alone in blank ocean.
      // The SVG viewBox clips whatever falls outside the frame.
      svg.append('g').selectAll('path')
        .data(countryFeatures.filter(f => f.id !== c.m49))
        .join('path')
        .attr('class', 'country-base')
        .attr('d', path);

      if (target) {
        svg.append('path')
          .datum(target)
          .attr('class', 'country-target')
          .attr('d', path);

        // Small island states can project to a couple of pixels, which reads as
        // nothing at all. Ring them so the highlight is actually findable.
        const bounds = path.bounds(target);
        const pxW = bounds[1][0] - bounds[0][0];
        const pxH = bounds[1][1] - bounds[0][1];
        if (Math.max(pxW, pxH) < 24) {
          const centroid = path.centroid(target);
          svg.append('circle')
            .attr('class', 'target-ring')
            .attr('cx', centroid[0])
            .attr('cy', centroid[1])
            .attr('r', 11);
        }
      } else {
        // A few micro-states (Tuvalu) have no polygon at 50m resolution, so
        // fall back to dropping a pin at the country's coordinates.
        const [lat, lng] = latlng;
        const pt = projection([lng, lat]);
        if (pt) {
          svg.append('circle')
            .attr('class', 'country-target')
            .attr('cx', pt[0]).attr('cy', pt[1]).attr('r', 3);
          svg.append('circle')
            .attr('class', 'target-ring')
            .attr('cx', pt[0]).attr('cy', pt[1]).attr('r', 11);
        }
      }

      el.mapHost.innerHTML = '';
      el.mapHost.appendChild(svg.node());
    }

    function revealSign() {
      const c = current();
      const s = c.sign;
      el.revealPanel.hidden = false;

      if (s && s.video_url) {
        let media;
        if (s.video_type === 'youtube') {
          renderYouTube(c, s);
          return;
        } else if (s.video_type === 'gif' || s.video_type === 'image') {
          media = `<img class="sign-media" src="${s.video_url}" alt="Sign for ${c.name_en}" />`;
        } else {
          media = `<video src="${s.video_url}" controls autoplay loop muted playsinline></video>`;
        }
        const endonym = s.is_endonym === true ? 'native sign (endonym)'
                      : s.is_endonym === false ? 'ASL/IS exonym'
                      : 'origin unconfirmed';
        const src = s.source_url
          ? `<a href="${s.source_url}" target="_blank" rel="noopener">${s.source_name || 'source'}</a>`
          : (s.source_name || 'source unrecorded');
        el.revealPanel.innerHTML = `
          ${media}
          <div class="sign-meta">
            ${s.sign_language || 'sign language unrecorded'} &middot; ${endonym} &middot; ${src}
            ${s.status === 'needs_review' ? ' &middot; <strong>needs your review</strong>' : ''}
          </div>`;
      } else {
        const langs = (c.sign_languages || []).join(', ') || 'unknown';
        const q = encodeURIComponent(c.name_en);
        el.revealPanel.innerHTML = `
          <div class="missing-box">
            <strong>No video sourced yet for ${c.name_en}.</strong>
            Sign language(s) in use: ${langs}.
            <p style="margin:0.6rem 0 0">
              Look it up on
              <a href="https://www.spreadthesign.com/en.us/search/?q=${q}" target="_blank" rel="noopener">Spreadthesign</a>
              or
              <a href="https://www.youtube.com/results?search_query=${q}+sign+language+country+name+sign" target="_blank" rel="noopener">YouTube</a>,
              then add the URL to the country&rsquo;s <code>sign.video_url</code> field.
            </p>
          </div>`;
      }
    }

    /** Jump straight to a country with every hint already given and the sign shown. */
    function jumpTo(iso2) {
      const i = deck.findIndex(x => x.iso2 === iso2);
      if (i < 0) return;
      deckIndex = i;
      renderCard();
      nextHint();   // map
      nextHint();   // native name
      nextHint();   // English name
      revealSign();
      renderCountryList();
    }

    function renderCountryList() {
      const host = document.getElementById('countryList');
      if (!host || !activeContinent) return;
      const filter = (document.getElementById('countryFilter').value || '')
        .trim().toLowerCase();

      // Group by UN subregion, each group alphabetical, groups alphabetical.
      const groups = new Map();
      activeContinent.data.countries
        .filter(c => !filter
          || c.name_en.toLowerCase().includes(filter)
          || (c.name_native || '').toLowerCase().includes(filter))
        .slice()
        .sort((a, b) => a.name_en.localeCompare(b.name_en))
        .forEach(c => {
          const k = c.subregion || activeContinent.data.continent;
          if (!groups.has(k)) groups.set(k, []);
          groups.get(k).push(c);
        });

      if (!groups.size) {
        host.innerHTML = '<li class="list-empty">No country matches that.</li>';
        return;
      }

      const currentIso = deck[deckIndex] && deck[deckIndex].iso2;
      host.innerHTML = '';
      [...groups.keys()].sort().forEach(region => {
        const head = document.createElement('li');
        head.className = 'list-group';
        head.textContent = region;
        host.appendChild(head);

        groups.get(region).forEach(c => {
          const li = document.createElement('li');
          const b = document.createElement('button');
          b.type = 'button';
          if (c.iso2 === currentIso) b.className = 'active';

          const name = document.createElement('span');
          name.textContent = c.name_en;
          b.appendChild(name);

          const tag = document.createElement('span');
          const s = c.sign || {};
          if (!s.video_url) {
            tag.className = 'tag no-video';
            tag.textContent = 'no video';
          } else {
            const mk = marks(c);
            if (Number.isFinite(mk.start)) {
              tag.className = mk.isDefault ? 'tag assumed' : 'tag';
              tag.textContent = mk.isDefault ? 'default' : fmt(mk.start);
            }
          }
          b.appendChild(tag);

          b.addEventListener('click', () => jumpTo(c.iso2));
          li.appendChild(b);
          host.appendChild(li);
        });
      });
    }

    function videoIdOf(sign) {
      const m = (sign.video_url || '').match(/([\w-]{11})(?:[?&]|$)/);
      return m ? m[1] : null;
    }

    function signMetaHtml(c, s) {
      const endonym = s.is_endonym === true ? 'native sign (endonym)'
                    : s.is_endonym === false ? 'ASL/IS exonym'
                    : 'origin unconfirmed';
      const src = s.source_url
        ? `<a href="${s.source_url}" target="_blank" rel="noopener">${s.source_name || 'source'}</a>`
        : (s.source_name || 'source unrecorded');
      return `${s.sign_language || 'sign language unrecorded'} &middot; ${endonym} &middot; ${src}`;
    }

    /**
     * Mounts the clip through the IFrame Player API rather than a bare iframe:
     * only the API can force the playback rate and report the current position,
     * which is what makes "set the timestamp from where I am" possible.
     */
    function renderYouTube(c, s) {
      const vid = videoIdOf(s);
      const m = marks(c);

      el.revealPanel.innerHTML = `
        <div id="ytHost"></div>
        <div class="ts-controls">
          <button class="ts-btn" id="setStart">Set start from here</button>
          <button class="ts-btn" id="setEnd">Set end</button>
          <button class="ts-btn clear" id="clearTs">Clear</button>
          <span class="ts-readout" id="tsReadout"></span>
        </div>
        <div class="rate-note">Playing at ${PLAYBACK_RATE}&times; speed.</div>
        <div class="sign-meta">
          ${signMetaHtml(c, s)}
          ${s.status === 'needs_review' ? ' &middot; <strong>needs your review</strong>' : ''}
        </div>`;

      function readout() {
        const cur = marks(c);
        const bits = [];
        bits.push(cur.start === null
          ? '<span class="unset">no start</span>'
          : `start <span class="set">${fmt(cur.start)}</span>`);
        if (cur.end !== null) bits.push(`end <span class="set">${fmt(cur.end)}</span>`);
        if (cur.isDefault) bits.push('<span class="unset">(assumed default \u2014 not reviewed)</span>');
        else if (cur.local) bits.push('<span class="unset">(saved locally)</span>');
        document.getElementById('tsReadout').innerHTML = bits.join(' &middot; ');
      }
      readout();

      if (ytApiReady && vid) {
        if (ytPlayer && ytPlayer.destroy) { try { ytPlayer.destroy(); } catch (e) {} }
        const vars = { rel: 0, modestbranding: 1 };
        if (m.start !== null) vars.start = Math.max(0, Math.floor(m.start));
        if (m.end !== null) vars.end = Math.ceil(m.end);
        ytPlayer = new YT.Player('ytHost', {
          videoId: vid,
          playerVars: vars,
          events: {
            // The rate resets on load and again when playback begins, so set it
            // in both places rather than trusting one.
            onReady: e => { try { e.target.setPlaybackRate(PLAYBACK_RATE); } catch (err) {} },
            onStateChange: e => {
              if (e.data === YT.PlayerState.PLAYING) {
                try { e.target.setPlaybackRate(PLAYBACK_RATE); } catch (err) {}
              }
            }
          }
        });
      } else if (vid) {
        // API blocked or still loading: fall back to a plain embed so the clip
        // still plays, just without rate control or position capture.
        const p = [];
        if (m.start !== null) p.push('start=' + Math.floor(m.start));
        if (m.end !== null) p.push('end=' + Math.ceil(m.end));
        document.getElementById('ytHost').outerHTML =
          `<iframe src="${s.video_url}${p.length ? '?' + p.join('&') : ''}" allowfullscreen title="Sign for ${c.name_en}"></iframe>`;
      }

      const now = () => {
        if (!ytPlayer || !ytPlayer.getCurrentTime) return null;
        const t = ytPlayer.getCurrentTime();
        return Number.isFinite(t) ? Math.max(0, Math.round(t * 10) / 10) : null;
      };

      document.getElementById('setStart').addEventListener('click', () => {
        const t = now();
        if (t === null) return;
        saveOverride(c.iso2, { start_seconds: t });
        readout();
      });
      document.getElementById('setEnd').addEventListener('click', () => {
        const t = now();
        if (t === null) return;
        saveOverride(c.iso2, { end_seconds: t });
        readout();
      });
      document.getElementById('clearTs').addEventListener('click', () => {
        saveOverride(c.iso2, { start_seconds: null, end_seconds: null });
        readout();
      });
    }

    function renderExportRow() {
      const row = document.getElementById('exportRow');
      if (!row) return;
      const all = loadOverrides();
      const n = Object.keys(all).length;
      row.innerHTML = n
        ? `<span class="export-count">${n} timestamp${n === 1 ? '' : 's'} saved in this browser.</span>
           <button class="ts-btn" id="exportBtn">Export JSON</button>
           <button class="ts-btn clear" id="wipeBtn">Discard all</button>`
        : `<span class="export-count">No timestamps captured yet. Reveal a sign, scrub to where it starts, and press &ldquo;Set start from here&rdquo;.</span>`;
      if (!n) return;
      document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sign-timestamps.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      });
      document.getElementById('wipeBtn').addEventListener('click', () => {
        if (!confirm('Discard every timestamp saved in this browser?')) return;
        try { localStorage.removeItem(LS_KEY); } catch (e) {}
        renderExportRow();
      });
    }

    function renderCoverage(data) {
      const total = data.countries.length;
      const tally = { verified: 0, needs_review: 0, missing: 0 };
      data.countries.forEach(c => {
        const st = c.sign && c.sign.status;
        if (st === 'verified') tally.verified++;
        else if (st === 'needs_review') tally.needs_review++;
        else tally.missing++;
      });
      const pct = n => (n / total * 100).toFixed(1) + '%';
      const missingNames = data.countries
        .filter(c => !c.sign || !c.sign.video_url)
        .map(c => c.name_en);

      el.coverage.innerHTML = `
        <strong>${data.continent} data coverage</strong>
        <div class="coverage-bar">
          <div class="seg-verified" style="width:${pct(tally.verified)}"></div>
          <div class="seg-review" style="width:${pct(tally.needs_review)}"></div>
          <div class="seg-missing" style="width:${pct(tally.missing)}"></div>
        </div>
        <div class="coverage-legend">
          <span><span class="dot seg-verified"></span>${tally.verified} verified</span>
          <span><span class="dot seg-review"></span>${tally.needs_review} needs review</span>
          <span><span class="dot seg-missing"></span>${tally.missing} no source yet</span>
        </div>
        ${missingNames.length ? `<p style="margin:0.75rem 0 0">Still needing a video: ${missingNames.join(', ')}.</p>` : ''}
        <div class="export-row" id="exportRow"></div>`;
      renderExportRow();
    }

    document.getElementById('countryFilter').addEventListener('input', renderCountryList);
    el.hintBtn.addEventListener('click', nextHint);
    el.revealBtn.addEventListener('click', revealSign);
    el.nextBtn.addEventListener('click', () => {
      deckIndex = (deckIndex + 1) % deck.length;
      renderCard();
    });

    (async function init() {
      renderSelector();
      await loadWorld();
      const first = CONTINENTS.find(c => c.file);
      if (first) {
        await loadContinent(first);
        renderSelector();
      }
    })();
  </script>
</body>
</html>
