<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Script</title>
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
  <!-- Charis SIL is an SIL font built for phonetic notation: the system fonts
       drop affricate tie bars (t͡ɕ rendered as tofu), which this page needs. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Charis+SIL:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" />
  <style>
    .script-head {
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .script-head .big {
      font-size: 3.5rem;
      line-height: 1;
      color: #1a2b3c;
    }

    .script-head h2 {
      margin: 0 0 0.3rem;
      font-size: 1.5rem;
    }

    .meta-line {
      color: #666;
      font-size: 0.92rem;
      margin: 0.1rem 0;
    }

    .note {
      max-width: 680px;
      color: #555;
      background: #f8f9fa;
      border-left: 3px solid #ccc;
      padding: 0.8rem 1rem;
      margin: 1rem 0 2rem;
      font-size: 0.92rem;
    }

    .crumb {
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }

    .crumb a { color: #0056b3; }

    .section-head {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #96a0a8;
      margin: 2rem 0 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #eceff1;
    }
    .section-head:first-of-type { margin-top: 0; }
    .section-head span { color: #c3cad1; font-weight: normal; }

    .letter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1rem;
    }

    .letter-blank { visibility: hidden; }

    /* The fixed grid gives every column equal width, so centre the cards
       inside them rather than letting them sit against the left edge. */
    .letter-grid.fixed { justify-items: center; }
    .letter-grid.fixed { gap: 0.7rem; }
    .letter-grid.fixed .letter-card { width: 100%; padding: 0.7rem; min-width: 0; }
    .letter-grid.fixed .letter-glyphs { font-size: 1.8rem; }
    .letter-grid.fixed .slot { min-height: 56px; }
    .letter-grid.fixed .slot img { max-height: 74px; }
    .letter-grid.fixed .row .k { min-width: 54px; font-size: 0.6rem; }
    .col-heads { justify-items: center; }
    .col-heads span { text-align: center; }

    .col-heads {
      display: grid;
      gap: 1rem;
      margin-bottom: 0.3rem;
      padding: 0 0.3rem;
    }

    .col-heads span {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9aa3ab;
    }

    @media (max-width: 900px) {
      .letter-grid.fixed { grid-template-columns: repeat(2, 1fr) !important; }
      .col-heads { display: none; }
      .letter-blank { display: none; }
    }

    .letter-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.09);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .letter-top {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
    }

    /* A Thai combining mark only attaches to the dotted circle when both
       come from the same font; with the system fallback the mark lands on
       nothing and renders as tofu. */
    .letter-glyphs { font-family: "Noto Sans Thai", "Noto Sans Devanagari", "Noto Sans Arabic", "Noto Sans", system-ui, -apple-system, sans-serif; }

    .letter-glyphs {
      font-size: 2.2rem;
      line-height: 1;
      color: #1a2b3c;
    }

    .letter-alt {
      font-size: 1.4rem;
      color: #7b848c;
    }

    .letter-name {
      font-size: 0.9rem;
      color: #555;
      margin-left: auto;
      text-align: right;
    }

    .row {
      display: flex;
      gap: 0.5rem;
      font-size: 0.85rem;
      align-items: baseline;
    }

    .row .k {
      color: #9aa3ab;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      min-width: 74px;
      flex-shrink: 0;
    }

    .row .v { color: #333; }
    .row .v.empty { color: #c3c9cf; font-style: italic; }

    .ipa-link {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted #ccd3d9;
    }

    .ipa-link:hover { color: #007bff; border-bottom-color: #007bff; }

    .ipa {
      font-family: "Charis SIL", "Doulos SIL", "Gentium Plus",
                   "Lucida Sans Unicode", "Arial Unicode MS", serif;
      font-size: 0.95rem;
    }

    .slot {
      border: 1px dashed #d8dde2;
      border-radius: 6px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c3c9cf;
      font-size: 0.78rem;
      text-align: center;
      padding: 0.4rem;
    }

    .slot img {
      max-width: 100%;
      max-height: 110px;
      border-radius: 4px;
    }

    .slot-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .variant-bar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0 0 1rem;
    }

    .variant-bar .k {
      color: #9aa3ab;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      margin-right: 0.3rem;
    }

    .variant-btn {
      font: inherit;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 0.3rem 0.8rem;
      border: 1px solid #cfd6dd;
      background: #fff;
      color: #456;
      border-radius: 4px;
      cursor: pointer;
    }

    .variant-btn.active {
      background: #007bff;
      border-color: #007bff;
      color: #fff;
    }

    .credits {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #eee;
      font-size: 0.82rem;
      color: #7b848c;
      max-width: 760px;
    }

    .credits p { margin: 0.35rem 0; }
    .credits a { color: #5b6b7a; }

    .refs {
      margin: -1rem 0 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
    }

    .refs a {
      font-size: 0.78rem;
      color: #8c959d;
      text-decoration: none;
      border-bottom: 1px dotted #ccd3d9;
    }

    .refs a:hover { color: #007bff; border-bottom-color: #007bff; }

    .letter-note a.term {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px dotted #c3cad1;
    }

    .letter-note a.term:hover { color: #007bff; border-bottom-color: #007bff; }

    .letter-note {
      margin: 0.6rem 0 0;
      padding-top: 0.5rem;
      border-top: 1px solid #f0f2f4;
      font-size: 0.78rem;
      line-height: 1.45;
      color: #77808a;
    }

    .emoji { font-size: 2.6rem; line-height: 1; }

    .sw-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 34px;
    }

    .sw-row .k {
      color: #9aa3ab;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      min-width: 74px;
    }

    .sw-img { max-height: 46px; width: auto; }

    .sw-key {
      font-size: 0.72rem;
      color: #aab2b9;
      letter-spacing: 0.03em;
    }

    .sw-text {
      font-family: "SuttonSignWritingOneD", monospace;
      font-size: 1.6rem;
      line-height: 1;
    }

    .example-word {
      font-size: 1rem;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    /* Deliberately quiet: a hint you can reach for, not a label competing
       with the word itself. */
    .say {
      font: inherit;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #b9c0c6;
      background: none;
      border: none;
      padding: 0 0.1rem;
      cursor: pointer;
      line-height: 1;
    }

    .say:hover, .say:focus-visible { color: #007bff; }
    .say.open { color: #cdd3d8; }

    .say-ipa {
      font-size: 0.86rem;
      color: #6b747c;
    }
    .example-word .w { white-space: nowrap; }
    .example-word b { color: #e8590c; }

    .fill-state {
      font-size: 0.85rem;
      color: #777;
      margin: 0 0 1.5rem;
    }

    .col-stat {
      display: inline-block;
      margin-right: 1.1rem;
      white-space: nowrap;
    }

    .fill-bar {
      display: inline-block;
      width: 70px;
      height: 8px;
      border-radius: 4px;
      background: #eee;
      overflow: hidden;
      vertical-align: middle;
      margin: 0 0.4rem;
    }

    .fill-bar span {
      display: block;
      height: 100%;
      background: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="pageTitle">Script</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="art.html">Art Portfolio</a></li>
          <li><a href="publications.html">Publications</a></li>
          <li class="has-sub">
            <a href="lugha.html">Lugha</a>
            <ul class="subnav">
              <li><a href="signs.html">Country Signs</a></li>
              <li><a href="study.html">Study</a></li>
              <li><a href="reference.html" aria-current="page">Reference</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <p class="crumb"><a href="reference.html">&larr; All scripts</a></p>
      <div id="body"><p>Loading&hellip;</p></div>
    </main>

    <footer>
      <p>&copy; 2026 David Ludeke</p>
    </footer>
  </div>

  <script>
    const slug = new URLSearchParams(location.search).get('s');

    function row(label, value, cls) {
      const filled = value !== null && value !== undefined && value !== ''
        && !(Array.isArray(value) && !value.length);
      const text = filled
        ? (Array.isArray(value) ? value.join(', ') : value)
        : '—';
      return `<div class="row">
          <span class="k">${label}</span>
          <span class="v ${filled ? (cls || '') : 'empty'}">${text}</span>
        </div>`;
    }

    /** Strips diacritics so \u03ae still matches \u03b7, \u0623 still matches \u0627. */
    const bare = s => s.normalize('NFD').replace(/[\u0300-\u036f\u0653-\u0655\u0670]/g, '');

    /** Bolds the letter inside the example word, ignoring accents. */
    function boldedWord(word, glyph, alt) {
      if (!word) return null;
      const flat = bare(word);
      for (const g of [glyph, alt].filter(Boolean)) {
        const gb = bare(g);
        if (!gb) continue;
        for (const hay of [word, flat]) {
          const i = hay.indexOf(gb) !== -1 ? hay.indexOf(gb) : hay.toLowerCase().indexOf(gb.toLowerCase());
          if (i !== -1 && flat.length === word.length) {
            return word.slice(0, i) + '<b>' + word.slice(i, i + g.length) + '</b>' + word.slice(i + g.length);
          }
        }
      }
      return word;
    }

    function render(d) {
      document.title = d.name + ' — Script Reference';
      document.getElementById('pageTitle').textContent = d.name;

      // Some scripts have more than one manual alphabet worth showing. Latin
      // has both BSL (two-handed) and ASL (one-handed); the choice is
      // remembered per script.
      const variantNames = [...new Set(
        d.letters.flatMap(L => Object.keys(L.handshape_variants || {})))];
      let variant = null;
      if (variantNames.length > 1) {
        try { variant = localStorage.getItem('handshapeVariant.' + d.slug); } catch (e) {}
        if (!variantNames.includes(variant)) variant = variantNames[0];
      }
      const shapeOf = L => (variant && (L.handshape_variants || {})[variant]) || L.handshape;
      // the toggle switches the SignWriting transcription too
      const fswOf = L => (variant && (L.signwriting_variants || {})[variant]) || L.signwriting;
      const handKey = fsw => {
        const m = (fsw || '').match(/S([0-9a-f]{3})([0-9a-f])([0-9a-f])/g) || [];
        return m.find(k => { const b = parseInt(k.slice(1, 4), 16); return b >= 0x100 && b <= 0x204; }) || null;
      };
      const swImageOf = L => {
        const k = handKey(fswOf(L));
        return k ? `images/signwriting/${k}.png`.replace('/images/', '/images/') &&
                   `images/signwriting/${d.slug}/${k}.png` : L.signwriting_image;
      };

      // Counted per column, not "has anything": with the handshapes wired in,
      // an any-field measure would read 100% while IPA and examples are empty.
      const n = d.letters.length;
      const cols = [
        ['handshapes', d.letters.filter(L => shapeOf(L)).length],
        ['IPA', d.letters.filter(L => (L.ipa || []).length).length],
        ['words', d.letters.filter(L => L.example_word).length],
        ['pictures', d.letters.filter(L => L.example_image).length],
        ['signwriting', d.letters.filter(L => swImageOf(L)).length]
      ];

      const cardFor = L => {
        const word = boldedWord(L.example_word, L.glyph, L.alt);
        return `
          <div class="letter-card">
            <div class="letter-top">
              <span class="letter-glyphs">${L.display_glyph || L.glyph}</span>
              ${L.alt ? `<span class="letter-alt">${L.alt}</span>` : ''}
              <span class="letter-name">${L.name || ''}</span>
            </div>
            ${row('Romanisation', L.romanization)}
            ${(L.ipa || []).length
                ? `<div class="row"><span class="k">IPA</span><span class="v ipa">` +
                  L.ipa.map(v => '/' + linkIpa(v) + '/').join(', ') + `</span></div>`
                : row('IPA', null)}
            <div class="slot-pair">
              <div class="slot">${shapeOf(L)
                ? `<img src="${shapeOf(L)}" alt="Handshape for ${L.name}" />`
                : 'handshape'}</div>
              <div class="slot">${L.example_image
                ? `<img src="${L.example_image}" alt="${L.example_gloss || ''}" />`
                : (L.example_emoji
                    ? `<span class="emoji" title="stand-in until a picture is added">${L.example_emoji}</span>`
                    : 'picture')}</div>
            </div>
            <div class="sw-row">
              <span class="k">SignWriting</span>
              ${swImageOf(L)
                ? `<img class="sw-img" src="${swImageOf(L)}" alt="SignWriting for ${L.name}" title="${handKey(fswOf(L)) || ''}" />`
                : '<span class="v empty">\u2014</span>'}
              ${handKey(fswOf(L)) ? `<code class="sw-key">${handKey(fswOf(L))}</code>` : ''}
            </div>
            <div class="example-word">
              <span class="w">${word || '<span class="v empty">example word</span>'}</span>
              ${L.example_ipa
                ? `<button class="say" type="button" aria-expanded="false"
                           aria-label="Show pronunciation of ${L.example_word}">ipa</button>
                   <span class="say-ipa ipa" hidden>/${L.example_ipa}/</span>`
                : ''}
            </div>
            ${L.example_gloss ? row('Means', L.example_gloss) : ''}
            ${L.notes ? `<p class="letter-note">${linkNote(L.notes)}</p>` : ''}
          </div>`;
      };

      // Link the first mention of each technical term in a note, so the notes
      // can stay one line and still lead somewhere.
      const terms = Object.keys(d.glossary || {}).sort((a, b) => b.length - a.length);
      const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      function linkNote(text) {
        if (!text) return text;
        const used = new Set();
        for (const t of terms) {
          if (used.has(t)) continue;
          const re = new RegExp(`\\b(${esc(t)})\\b`, 'i');
          if (re.test(text)) {
            text = text.replace(re, `<a class="term" target="_blank" rel="noopener" href="${d.glossary[t]}">$1</a>`);
            used.add(t);
          }
        }
        return text;
      }

      // Link each IPA symbol to its article. Longest key first, so t͡ɕʰ wins
      // over t and ɕ rather than being chopped into three links.
      const ipaKeys = Object.keys(d.ipa_links || {}).sort((a, b) => b.length - a.length);
      function linkIpa(sym) {
        let out = '', i = 0;
        while (i < sym.length) {
          const hit = ipaKeys.find(k => sym.startsWith(k, i));
          if (hit) {
            out += `<a class="ipa-link" target="_blank" rel="noopener" href="${d.ipa_links[hit]}">${hit}</a>`;
            i += hit.length;
          } else {
            out += sym[i]; i++;
          }
        }
        return out;
      }

      const byGlyph = Object.fromEntries(d.letters.map(L => [L.glyph, L]));
      // A script with a layout keeps its table shape: blanks stay blank so
      // every column means the same thing all the way down.
      const gridOpen = `<div class="letter-grid${d.layout ? ' fixed' : ''}"` +
        (d.layout ? ` style="grid-template-columns: repeat(${d.layout.cols}, minmax(0, 1fr))"` : '') + '>';

      const colHeads = d.layout
        ? `<div class="col-heads" style="grid-template-columns: repeat(${d.layout.cols}, minmax(0, 1fr))">
             ${(d.layout.col_labels || []).map(c => `<span>${c}</span>`).join('')}
           </div>`
        : '';
      const head = (name, n) => `<h3 class="section-head">${name} <span>${n}</span></h3>`;
      // everything the sections do not claim belongs to the first one
      const inSection = sec => d.letters.filter(L =>
        (L.section || (d.sections || [])[0]) === sec);

      let cards;
      if (d.layout) {
        // kana keeps its gojuon table and hangs the extra signs below it
        const laid = d.layout.rows.map(row => row.map(g =>
          g && byGlyph[g] ? cardFor(byGlyph[g]) : '<div class="letter-blank"></div>'
        ).join('')).join('');
        const rest = (d.sections || []).slice(1);
        cards = (rest.length ? head(d.sections[0], inSection(d.sections[0]).length) : '') +
                colHeads + gridOpen + laid + '</div>' +
                rest.map(sec => {
                  const m = inSection(sec);
                  return m.length ? head(sec, m.length) +
                    `<div class="letter-grid">${m.map(cardFor).join('')}</div>` : '';
                }).join('');
      } else if ((d.sections || []).length > 1) {
        // Thai keeps its vowel signs and tone marks apart from the 44
        // consonants, since they are a different kind of thing and the
        // alphabet is conventionally counted without them.
        cards = d.sections.map(sec => {
          const m = inSection(sec);
          return m.length ? head(sec, m.length) + gridOpen + m.map(cardFor).join('') + '</div>' : '';
        }).join('');
      } else {
        cards = gridOpen + d.letters.map(cardFor).join('') + '</div>';
      }

      const html = `
        <div class="script-head">
          <div class="big">${d.representative}</div>
          <div>
            <h2>${d.name}</h2>
            <p class="meta-line">${d.sign_language.abbr} &middot; ${d.sign_language.name}</p>
            <p class="meta-line">${d.languages.join(', ')}</p>
          </div>
        </div>
        ${variantNames.length > 1 ? `
        <div class="variant-bar">
          <span class="k">Manual alphabet</span>
          ${variantNames.map(v => `<button class="variant-btn${v === variant ? ' active' : ''}" data-v="${v}">${v}</button>`).join('')}
        </div>` : ''}
        <p class="note">${d.note}</p>
        ${(d.links || []).length ? `<p class="refs">${d.links.map(l =>
            `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('')}</p>` : ''}
        <p class="fill-state">
          ${n} letters &middot;
          ${cols.map(([label, got]) => `
            <span class="col-stat">${label} ${got}/${n}
              <span class="fill-bar"><span style="width:${Math.round(got / n * 100)}%"></span></span>
            </span>`).join('')}
        </p>
        ${cards}
        ${(d.attribution || []).length ? `
        <div class="credits">
          ${d.attribution.map(a => `<p><strong>${a.what}</strong> &mdash;
             <a href="${a.url}" target="_blank" rel="noopener">${a.credit}</a>,
             ${a.licence}. ${a.note || ''}</p>`).join('')}
        </div>` : ''}`;
      document.getElementById('body').innerHTML = html;
      document.querySelectorAll('.say').forEach(b => {
        b.addEventListener('click', () => {
          const out = b.nextElementSibling;
          const show = out.hidden;
          out.hidden = !show;
          b.setAttribute('aria-expanded', String(show));
          b.classList.toggle('open', show);
        });
      });
      document.querySelectorAll('.variant-btn').forEach(b => {
        b.addEventListener('click', () => {
          try { localStorage.setItem('handshapeVariant.' + d.slug, b.dataset.v); } catch (e) {}
          render(d);
        });
      });
    }

    if (!slug) {
      document.getElementById('body').innerHTML =
        '<p>No script chosen. <a href="reference.html">Pick one.</a></p>';
    } else {
      fetch(`assets/data/scripts/${slug}.json`, { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
        .then(render)
        .catch(() => {
          document.getElementById('body').innerHTML =
            '<p>Could not load that script. <a href="reference.html">Back to all scripts.</a></p>';
        });
    }
  </script>
</body>
</html>
